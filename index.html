<script>
// Device storage (IndexedDB) with the same get/set/delete shape the app uses
(function () {
  var dbp;
  function open() {
    return new Promise(function (res, rej) {
      var r = indexedDB.open("game-shelf", 1);
      r.onupgradeneeded = function () { r.result.createObjectStore("kv"); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function tx(mode, fn) {
    dbp = dbp || open();
    return dbp.then(function (db) {
      return new Promise(function (res, rej) {
        var t = db.transaction("kv", mode), req = fn(t.objectStore("kv"));
        t.oncomplete = function () { res(req && req.result); };
        t.onerror = function () { rej(t.error); };
      });
    });
  }
  window.storage = {
    get: function (key) {
      return tx("readonly", function (s) { return s.get(key); }).then(function (v) {
        if (v === undefined) throw new Error("not found");
        return { key: key, value: v, shared: false };
      });
    },
    set: function (key, value) {
      return tx("readwrite", function (s) { return s.put(value, key); }).then(function () { return { key: key, value: value, shared: false }; });
    },
    delete: function (key) {
      return tx("readwrite", function (s) { return s.delete(key); }).then(function () { return { key: key, deleted: true, shared: false }; });
    }
  };
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
})();
</script>

async function fetchBgp(eids) {

  const r = await fetch(`https://boardgameprices.com/api/info?eid=${eids.join(",")}&currency=USD&destination=US&sort=CHEAP1&preferred_language=GB&sitename=${site}`);

  const d = await r.json();
  const out = {};
  (d.items || []).forEach((it) => {
    const eid = String(it.external_id || "");
    if (!eid || out[eid]) return; // first item is the preferred (English) version
    const offers = (it.prices || []).filter((p) => Number(p.price) > 0);
    const inStock = offers.filter((p) => p.stock === "Y");
    const pool = inStock.length ? inStock : offers;
    if (!pool.length) { out[eid] = { none: true, url: it.url || null, at: Date.now() }; return; }
    const totals = pool.map((p) => Number(p.price)).sort((a, b) => a - b);
    out[eid] = { low: Math.round(totals[0]), offers: pool.length, inStock: inStock.length > 0, url: it.url || null, at: Date.now() };

}

const WD = "https://www.wikidata.org/w/api.php";
async function wikidataBgg(name) {
  const s = await fetch(`${WD}?action=wbsearchentities&format=json&origin=*&language=en&uselang=en&type=item&limit=20&search=${enc(name)}`);
  if (!s.ok) throw new Error(`search ${s.status}`);
  const sd = await s.json();
  const hits = sd.search || [];
  if (!hits.length) return [];
  const ids = hits.map((h) => h.id);
  const e = await fetch(`${WD}?action=wbgetentities&format=json&origin=*&languages=en&props=${enc("labels|claims")}&ids=${enc(ids.join("|"))}`);
  if (!e.ok) throw new Error(`details ${e.status}`);
  const ed = await e.json();
  const val = (ent, p) => ent.claims?.[p]?.[0]?.mainsnak?.datavalue?.value;
  const seen = new Set();
  return ids
    .map((id) => ed.entities?.[id])
    .filter(Boolean)
    .map((ent) => {
      const bgg = val(ent, "P2339");
      const t = val(ent, "P577");
      const year = t && typeof t.time === "string" ? Number(t.time.slice(1, 5)) || null : null;
      const label = ent.labels?.en?.value || hits.find((h) => h.id === ent.id)?.label;
      return { name: label, bggId: typeof bgg === "string" ? bgg : null, year };
    })
    .filter((x) => x.name && x.bggId && /^\d+$/.test(x.bggId) && !seen.has(x.bggId) && seen.add(x.bggId))

}

const b64encode = (str) => {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
};
const b64decode = (b64) => {
  const bin = atob(b64.replace(/\s/g, ""));

async function ghGet(cfg, path) {

  const r = await fetch(url, { headers: ghHeaders(cfg), cache: "no-store" });
  if (r.status === 404) return null;
  if (!r.ok) throw ghErr(r);
  const meta = await r.json();
  let text;
  if (meta.content && meta.encoding === "base64") text = b64decode(meta.content);
  else {
    // Files over 1 MB come back without content; fetch them raw
    const r2 = await fetch(url, { headers: { ...ghHeaders(cfg), Accept: "application/vnd.github.raw+json" }, cache: "no-store" });
    if (!r2.ok) throw ghErr(r2);
    text = await r2.text();

    method: "PUT",

    body: JSON.stringify({ message: `Update ${path}`, content: b64encode(JSON.stringify(obj)), ...(sha ? { sha } : {}) }),

const mergeShelves = (a, b) => {
  if (!b) return tidy(a);
  const deleted = { ...(b.deleted || {}), ...(a.deleted || {}) };
  const byId = {};
  [...(b.games || []), ...(a.games || [])].forEach((g0) => {
    const g = normalize(g0);

const canonPledges = (s) => stable(tidyPledges(s));
// Same rules as the shelf: newer edit wins per pledge, deletions stick
const mergePledges = (a, b) => {
  if (!b) return tidyPledges(a);
  const deleted = { ...(b.deleted || {}) };
  Object.entries((a && a.deleted) || {}).forEach(([k, t]) => { if (t > (deleted[k] || 0)) deleted[k] = t; });
  const byId = {};
  [...(b.pledges || []), ...((a && a.pledges) || [])].forEach((p) => {
    const prev = byId[p.id];
    if (!prev || (p.updatedAt || 0) >= (prev.updatedAt || 0)) byId[p.id] = p;
  });
  return tidyPledges({ ...b, ...(a || {}), pledges: Object.values(byId).filter((p) => !deleted[p.id]), deleted });
};
// ---------- Followed campaigns (watching, not backed) ----------
// Their own file (follows.json), so older app versions never see or rewrite them,
// and they never touch pledges or the shelf
const FOLLOW_KEY = "boardgame-follows-v1";
const FOLLOW_FILE = "follows.json";
const tidyFollows = (s) => ({
  ...(s || {}),
  follows: [...((s && s.follows) || [])].sort((a, b) => (a.id < b.id ? -1 : 1)),
  deleted: { ...((s && s.deleted) || {}) },
  ignored: { ...((s && s.ignored) || {}) },
});
const canonFollows = (s) => stable(tidyFollows(s));
const laterTimes = (x, y) => { const o = { ...(y || {}) }; Object.entries(x || {}).forEach(([k, t]) => { if (t > (o[k] || 0)) o[k] = t; }); return o; };
// Same rules as pledges: newer edit wins per campaign, unfollows and "not interested" stick
const mergeFollows = (a, b) => {
  if (!b) return tidyFollows(a);
  const deleted = laterTimes(a && a.deleted, b.deleted);
  const ignored = laterTimes(a && a.ignored, b.ignored);
  const byId = {};
  [...(b.follows || []), ...((a && a.follows) || [])].forEach((f) => {
    const prev = byId[f.id];
    if (!prev || (f.updatedAt || 0) >= (prev.updatedAt || 0)) byId[f.id] = f;
  });
  return tidyFollows({ ...b, ...(a || {}), follows: Object.values(byId).filter((f) => !deleted[f.id]), deleted, ignored });
};
const newsPlatform = (i) => (i.platform && PLATFORMS.includes(i.platform) ? i.platform : i.from === "Gamefound" ? "Gamefound" : "Kickstarter");
const localDay = (iso) => { const d = new Date(iso); return isNaN(d) ? today() : `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
// Work out who each email belongs to: a pledge, a followed campaign, or nobody yet.
// "top" is what shows under New updates (and counts on the Pledges button).
const sortNews = (news, pledges, followData) => {
  const follows = followData.follows || [];
  const pById = Object.fromEntries(pledges.map((p) => [p.id, p]));
  const fById = Object.fromEntries(follows.map((f) => [f.id, f]));
  const pByName = Object.fromEntries(pledges.map((p) => [norm(p.name), p]));
  const fByName = Object.fromEntries(follows.map((f) => [norm(f.name), f]));
  const ignored = followData.ignored || {};
  const read = news.read || {};
  const all = Object.values(news.items || {}).sort((a, b) => (b.date || "").localeCompare(a.date || "")).map((i) => {
    const ref = i.pledge || i.follow;
    const p = (ref && pById[ref]) || (!i.pledge ? pByName[norm(i.game)] : null) || null;
    const f = p ? null : (i.follow && fById[i.follow]) || (!i.pledge ? fByName[norm(i.game)] : null) || null;
    return { i, p, f, fresh: !read[i.id] };
  });
  const top = all.filter(({ i, p, f, fresh }) => fresh && (
    p ? i.kind !== "backed"
    : f ? i.kind === "backed"
    : i.kind === "backed" || (i.kind === "campaign" ? !ignored[norm(i.game)] : !!i.pledge)
  ));
  return { all, top };
};

// One pledge per line: Name | Platform | Pledge manager | Status | USD 999 | details (optional, kept as notes)
const parsePledgeLines = (text) => {
  const ok = [], bad = [];
  const pick = (list, v, dflt) => list.find((x) => norm(x) === norm(v)) || dflt;
  text.split("\n").map((l) => l.trim()).filter(Boolean).forEach((line) => {
    const parts = line.split("|").map((s) => s.trim());
    if (parts.length < 5 || !parts[0]) { bad.push(line); return; }
    const [name, platform, pm, statusText, money, ...rest] = parts;
    const currency = ((money.match(/[A-Za-z]{3}/) || [])[0] || "USD").toUpperCase();
    const pledgeAmount = parseFloat(money.replace(/,/g, "").replace(/^[^0-9]*/, ""));
    if (isNaN(pledgeAmount)) { bad.push(line); return; }
    ok.push({
      id: uid(), name, platform: pick(PLATFORMS, platform, "Kickstarter"),
      pledgeManager: /^none/i.test(pm) ? "none yet" : pick(PLEDGE_MANAGERS, pm, pm || "none yet"),
      status: pick(PLEDGE_STATUSES, statusText, LEGACY_STATUS[statusText] || "Charged"),
      pledgeAmount, currency, notes: rest.join(" | "), onShelf: false, updatedAt: Date.now(),
    });
  });
  return { ok, bad };
};

function Toggle({ label, checked, onChange }) {
  return (
    <label className="switch" style={{ marginLeft: 0 }}>
      <input type="checkbox" role="switch" checked={!!checked} onChange={(e) => onChange(e.target.checked)} />
      <span>{label}</span>
    </label>
  );
}

      <label className="f">Add-ons<input value={p.addOns || ""} onChange={set("addOns")} /></label>

        <label className="f">Charged<input type="date" value={p.chargeDate || ""} onChange={set("chargeDate")} /></label>

        <Toggle label="Not a shelf item (digital, promo, accessory)" checked={p.notShelfItem} onChange={(on) => upd(p.id, (x) => ({ ...x, notShelfItem: on, onShelf: on ? false : x.onShelf }))} />
      </div>
      {!p.onShelf && !p.notShelfItem && (
        <label className="f">Already on your shelf as…
          <select value="" onChange={(e) => e.target.value && upd(p.id, (x) => ({ ...x, onShelf: true, shelfId: e.target.value }))}>

function Pledges({ store, setStore, onAddToShelf, setToast, syncErr, owned, news, setNews, followStore, setFollowStore, followSyncErr }) {
  const [openId, setOpenId] = useState(null);
  const [adding, setAdding] = useState(null); // null | "one" | "paste" | "follow"
  const [draft, setDraft] = useState(null);
  const [draftFrom, setDraftFrom] = useState(null); // { newsId, followId } when the add form came from an email or a followed campaign
  const [fdraft, setFdraft] = useState(null);
  const [pasteText, setPasteText] = useState("");
  const [pasteErr, setPasteErr] = useState("");
  const [shelving, setShelving] = useState(null); // { id, name }
  const list = store.pledges || [];
  const ownedSorted = useMemo(() => [...owned].sort((a, b) => a.name.localeCompare(b.name)), [owned]);

  const upd = (id, fn) => setStore((s) => ({ ...s, pledges: s.pledges.map((p) => (p.id === id ? { ...fn(p), updatedAt: Date.now() } : p)) }));
  const removeP = (p) => {
    if (!window.confirm(`Delete the pledge for ${p.name}? This only removes the pledge, not anything on your shelf.`)) return;
    setStore((s) => ({ ...s, pledges: s.pledges.filter((x) => x.id !== p.id), deleted: { ...(s.deleted || {}), [p.id]: Date.now() } }));
    setOpenId(null);
    setToast(`Deleted pledge for ${p.name}`);
  };
  const startShelve = (p) => setShelving({ id: p.id, name: shelfName(p.name) });
  const blank = () => ({ name: "", platform: "Kickstarter", pledgeManager: "none yet", pledgeId: "", status: "Backed", pledgeAmount: "", currency: "USD", backedDate: today(), chargeDate: "", estDelivery: "", tier: "", addOns: "", notes: "" });
  const saveDraft = () => {
    if (!draft.name.trim()) return;
    // A followed campaign keeps its id when it becomes a pledge, so its emails follow it
    const followId = draftFrom && draftFrom.followId;
    const p = { ...draft, id: followId || uid(), name: draft.name.trim(), url: fixUrl(draft.url), pledgeAmount: num(String(draft.pledgeAmount).replace(/,/g, "")) || 0, onShelf: false, updatedAt: Date.now() };
    Object.keys(p).forEach((k) => p[k] === "" && delete p[k]);
    setStore((s) => ({ ...s, pledges: [...(s.pledges || []).filter((x) => x.id !== p.id), p] }));
    if (followId) dropFollow(followId);
    if (draftFrom && draftFrom.newsId) markRead([draftFrom.newsId]);
    setAdding(null); setDraft(null); setDraftFrom(null);
    setToast(`Added pledge for ${p.name}`);
  };
  const closeForm = () => { setAdding(null); setDraft(null); setDraftFrom(null); setFdraft(null); };
  // Open the add form filled in from a "You just backed" email or a followed campaign
  const startPledgeFrom = ({ i, f }) => {
    setDraft({
      ...blank(),
      name: (f && f.name) || i.game || "",
      platform: f ? f.platform : newsPlatform(i),
      backedDate: i ? localDay(i.date) : today(),
      url: (i && i.link) || (f && f.url) || "",
      notes: (f && f.notes) || "",
    });
    setDraftFrom({ newsId: i && i.id, followId: f && f.id });
    setAdding("one");
    setOpenId(null);
    window.scrollTo({ top: 0, behavior: "smooth" });
  };

  // ---------- Followed campaigns ----------
  const follows = followStore.follows || [];
  const updF = (id, fn) => setFollowStore((s) => ({ ...s, follows: (s.follows || []).map((f) => (f.id === id ? { ...fn(f), updatedAt: Date.now() } : f)) }));
  const dropFollow = (id) => setFollowStore((s) => ({ ...s, follows: (s.follows || []).filter((x) => x.id !== id), deleted: { ...(s.deleted || {}), [id]: Date.now() } }));
  const addFollow = (f0) => {
    const f = { id: uid(), name: f0.name.trim(), platform: f0.platform, url: fixUrl(f0.url) || undefined, notes: (f0.notes || "").trim() || undefined, addedAt: localDay(Date.now()), updatedAt: Date.now() };
    setFollowStore((s) => {
      const ig = { ...(s.ignored || {}) };
      delete ig[norm(f.name)];
      return { ...s, follows: [...(s.follows || []), f], ignored: ig };
    });
    setToast(`Following ${f.name}`);
    return f;
  };
  const saveFollowDraft = () => {
    if (!fdraft.name.trim()) return;
    if (follows.some((f) => norm(f.name) === norm(fdraft.name)) || list.some((p) => norm(p.name) === norm(fdraft.name))) {
      setToast(`${fdraft.name.trim()} is already here`);
      return;
    }
    addFollow(fdraft);
    closeForm();
  };
  const unfollow = (f) => {
    if (!window.confirm(`Stop following ${f.name}? Its emails will stop showing here.`)) return;
    dropFollow(f.id);
    setOpenId(null);
    setToast(`Stopped following ${f.name}`);
  };
  const notInterested = (i) => {
    setFollowStore((s) => ({ ...s, ignored: { ...(s.ignored || {}), [norm(i.game)]: Date.now() } }));
    markRead([i.id]);
    setToast(`Hiding emails about ${i.game}`);
  };
  const importPaste = () => {
    const { ok, bad } = parsePledgeLines(pasteText);
    const have = new Set(list.map((p) => norm(p.name)));
    const fresh = ok.filter((p) => !have.has(norm(p.name)));
    if (fresh.length) setStore((s) => ({ ...s, pledges: [...(s.pledges || []), ...fresh] }));
    const skipped = ok.length - fresh.length;
    setPasteErr(bad.length ? `Couldn't read ${bad.length} line${bad.length === 1 ? "" : "s"}: ${bad.slice(0, 3).join("; ")}` : "");
    setToast(`Added ${fresh.length} pledge${fresh.length === 1 ? "" : "s"}${skipped ? `, ${skipped} already here` : ""}`);
    if (!bad.length) { setPasteText(""); setAdding(null); }
  };

  const open = list.filter((p) => !isClosed(p));
  const byWait = (a, b) => (waitFrom(a) || "9").localeCompare(waitFrom(b) || "9");
  const of = (...sts) => open.filter((p) => sts.includes(p.status)).sort(byWait);
  const needs = of("PM open");
  const upcoming = of("Backed").sort((a, b) => (a.chargeDate || "9").localeCompare(b.chargeDate || "9"));
  const groups = [
    ["Shipping", of("Shipping")],
    ["Order locked / PM done", of("Order locked", "PM done")],
    ["Charged", of("Charged")],
    ["In production", of("In production")],
  ];
  const received = list.filter((p) => p.status === "Received")
    .sort((a, b) => (b.receivedDate || "").localeCompare(a.receivedDate || "") || a.name.localeCompare(b.name));
  const ukraine = list.filter((p) => p.status === "Ukraine");
  const longCount = open.filter(isLongWait).length;
  const toShelve = received.filter((p) => !p.onShelf && !p.notShelfItem).length;

  // Emails about pledges (from the scheduled Gmail check)
  const isRead = (i) => !!(news.read || {})[i.id];
  const sorted = sortNews(news, list, followStore);
  const unread = sorted.top;
  // Emails for one pledge or followed campaign (the "You just backed" note itself isn't one of them)
  const emailsFor = (x) => sorted.all.filter((e) => (e.p === x || e.f === x) && e.i.kind !== "backed");
  const unreadFor = (x) => emailsFor(x).filter((e) => e.fresh).length;
  const followNew = follows.reduce((n, f) => n + unreadFor(f), 0);
  const markRead = (ids) => setNews((s) => ({ ...s, read: { ...(s.read || {}), ...Object.fromEntries(ids.map((id) => [id, Date.now()])) } }));
  const applySuggest = (i, p) => {
    upd(p.id, (x) => ({ ...x, status: i.suggest, receivedDate: i.suggest === "Received" ? x.receivedDate || today() : x.receivedDate }));
    markRead([i.id]);
    setToast(`${p.name} set to ${i.suggest}`);
  };
  const emailCard = ({ i, p, f }, compact) => {
    const canSuggest = p && i.suggest && i.suggest !== p.status && PLEDGE_STATUSES.includes(i.suggest) && !isClosed(p);
    const fresh = !isRead(i);
    const when = <span>{i.date ? fmtDate(i.date.slice(0, 10)) : ""}</span>;
    // "You just backed X" for a game that isn't a pledge yet
    if (i.kind === "backed" && !p) return (
      <div className={`newsitem k-backed${fresh ? "" : " seen"}`} key={i.id}>
        <div className="nhead"><b>{i.game || "New backing"}</b>{when}</div>
        <p className="nsubj">You backed this on {newsPlatform(i)}{f ? ". You were following it" : ""}. It isn't in your pledges yet.</p>
        <div className="nact">
          <span className="pill nk-backed">New backing</span>
          {i.mail && <a className="plink" href={i.mail} target="_blank" rel="noreferrer">Email ↗</a>}
          <button className="btn felt" onClick={() => startPledgeFrom({ i, f })}>Add as pledge</button>
          {fresh && <button className="btn ghost" onClick={() => markRead([i.id])}>Dismiss</button>}
        </div>
      </div>
    );
    // An update from a campaign that's neither a pledge nor followed
    if (i.kind === "campaign" && !p && !f) return (
      <div className={`newsitem k-campaign${fresh ? "" : " seen"}`} key={i.id}>
        <div className="nhead"><b>{i.game || "Campaign"}</b>{when}</div>
        <p className="nsubj">{i.subject}</p>
        {i.summary && <p className="hint" style={{ margin: 0 }}>{i.summary}</p>}
        <p className="hint" style={{ margin: 0 }}>You're not backing or following this campaign.</p>
        <div className="nact">
          {i.link && <a className="plink" href={i.link} target="_blank" rel="noreferrer">Open update ↗</a>}
          {i.mail && <a className="plink" href={i.mail} target="_blank" rel="noreferrer">Email ↗</a>}
          <button className="btn felt" onClick={() => addFollow({ name: i.game, platform: newsPlatform(i), url: i.project || "" })}>Follow it</button>
          <button className="btn ghost" onClick={() => notInterested(i)}>Not interested</button>
        </div>
      </div>
    );
    return (
      <div className={`newsitem k-${i.kind && i.kind !== "campaign" ? i.kind : "update"}${fresh ? "" : " seen"}`} key={i.id}>
        <div className="nhead">
          <b>{compact ? i.subject : p ? p.name : f ? f.name : i.game || "Pledge"}</b>
          {when}
        </div>
        {!compact && <p className="nsubj">{i.subject}</p>}
        {i.summary && <p className="hint" style={{ margin: 0 }}>{i.summary}</p>}
        <div className="nact">
          {i.kind && !["update", "campaign"].includes(i.kind) && <span className={`pill nk-${i.kind}`}>{NEWS_KINDS[i.kind] || i.kind}</span>}
          {i.link && <a className="plink" href={i.link} target="_blank" rel="noreferrer">Open update ↗</a>}
          {i.mail && <a className="plink" href={i.mail} target="_blank" rel="noreferrer">Email ↗</a>}
          {canSuggest && <button className="btn felt" onClick={() => applySuggest(i, p)}>Set to {i.suggest}</button>}
          {fresh && <button className="btn ghost" onClick={() => markRead([i.id])}>Mark read</button>}
        </div>
      </div>
    );
  };

  const dateLine = (p) => {
    if (p.status === "Received") return p.receivedDate ? `Received ${fmtDate(p.receivedDate)}` : "";
    if (p.status === "Backed" && p.chargeDate) {
      const d = Math.round((new Date(p.chargeDate + "T12:00:00") - new Date(today() + "T12:00:00")) / 86400000);
      return `Charges ${fmtDate(p.chargeDate)}${d >= 0 && d <= 30 ? ` (${d === 0 ? "today" : d === 1 ? "tomorrow" : `in ${d} days`})` : ""}`;
    }
    if (p.chargeDate) return `Charged ${fmtDate(p.chargeDate)}`;
    if (p.backedDate) return `Backed ${fmtDate(p.backedDate)}`;
    return "";
  };

  const card = (p) => {
    const isOpen = openId === p.id;
    const long = isLongWait(p);
    const showShelve = !p.onShelf && !p.notShelfItem && !isOpen && (p.status === "Shipping" || p.status === "Received");
    const sub = [p.platform + (p.pledgeManager && p.pledgeManager !== "none yet" && p.pledgeManager !== p.platform ? ` via ${p.pledgeManager}` : ""), p.pledgeId ? `#${p.pledgeId}` : ""].filter(Boolean).join(" · ");
    const when = [dateLine(p), !isClosed(p) && p.estDelivery ? `Est. ${fmtMonth(p.estDelivery)}` : ""].filter(Boolean).join(" · ");
    return (
      <div className={`pledge${long ? " long" : ""}${p.status === "PM open" ? " act" : ""}`} key={p.id} id={`p-${p.id}`}>
        <div className="prow">
          <button className="name" aria-expanded={isOpen} onClick={() => setOpenId(isOpen ? null : p.id)}>
            <b>{p.name}</b>
            {p.tier ? <span>{p.tier}</span> : null}
            <span>{sub}</span>
            {when ? <span>{when}</span> : null}
          </button>
          <div className="amt">{fmtMoney(pledgeCost(p), p.currency)}</div>
        </div>
        <div className="pmeta">
          <span className={`pill st-${norm(p.status)}`}>{p.status}</span>

// ---------- Images ----------
const loadImage = (file) =>
  new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = rej;
    img.src = url;
  });
const shrink = async (file) => {
  const img = await loadImage(file);
  const s = Math.min(1, 240 / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * s);
  c.height = Math.round(img.height * s);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.72);
};
const downscale = async (file, max) => {
  const img = await loadImage(file).catch(() => null);
  if (!img) return file;
  const s = Math.min(1, max / Math.max(img.width, img.height));
  if (s === 1) return file;
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * s);
  c.height = Math.round(img.height * s);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return new Promise((res) => c.toBlob((b) => res(b ? new File([b], "scan.jpg", { type: "image/jpeg" }) : file), "image/jpeg", 0.9));
};

// ---------- Barcode reading (on the phone, no lookup service) ----------
let bcLib = null;
const loadScript = (src) =>
  new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
const FORMATS = ["ean_13", "upc_a", "upc_e", "ean_8"];
const DETECTOR_URLS = [
  "https://cdn.jsdelivr.net/npm/barcode-detector@2/dist/es/pure.min.js",
  "https://cdn.jsdelivr.net/npm/barcode-detector@2/+esm",
  "https://cdn.jsdelivr.net/npm/barcode-detector@3/+esm",
];
let detectorP = null;
function getDetector() {
  if (!detectorP) {
    detectorP = (async () => {
      if ("BarcodeDetector" in window) {
        try {
          const f = await window.BarcodeDetector.getSupportedFormats();
          if (f.includes("ean_13")) return new window.BarcodeDetector({ formats: FORMATS });
        } catch (e) { /* use ZXing instead */ }
      }
      for (const u of DETECTOR_URLS) {
        try {
          const m = await import(u);
          const BD = m.BarcodeDetector || (m.default && m.default.BarcodeDetector);
          if (BD) return new BD({ formats: FORMATS });
        } catch (e) { /* try the next source */ }
      }
      throw new Error("scanner engine didn't load");
    })().catch((e) => { detectorP = null; throw e; });
  }
  return detectorP;
}
// Product barcodes carry a check digit; reject anything that fails it
const validGtin = (s) => {
  if (!/^(\d{12}|\d{13})$/.test(s)) return false;
  const d = s.split("").map(Number);
  const check = d.pop();
  const sum = d.reverse().reduce((a, n, i) => a + n * (i % 2 === 0 ? 3 : 1), 0);
  return (10 - (sum % 10)) % 10 === check;
};
const okCode = (v) => !!v && (/^\d{8}$/.test(v) || validGtin(v));

async function ensureScanLib() {
  if (window.Html5Qrcode) return;
  bcLib = bcLib || loadScript("https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js");
  try { await bcLib; } catch (e) { bcLib = null; throw e; }
}
const scanFormats = () => {
  const F = window.Html5QrcodeSupportedFormats;
  return [F.EAN_13, F.UPC_A, F.UPC_E, F.EAN_8];
};
const rotated = async (file, max) => {
  const img = await loadImage(file).catch(() => null);
  if (!img) return null;
  const s = Math.min(1, max / Math.max(img.width, img.height));
  const w = Math.round(img.width * s), h = Math.round(img.height * s);
  const c = document.createElement("canvas");
  c.width = h; c.height = w;
  const x = c.getContext("2d");
  x.translate(h / 2, w / 2);
  x.rotate(Math.PI / 2);
  x.drawImage(img, -w / 2, -h / 2, w, h);
  return new Promise((res) => c.toBlob((b) => res(b ? new File([b], "turned.jpg", { type: "image/jpeg" }) : null), "image/jpeg", 0.9));
};

async function decodeBarcode(file) {
  try {
    const det = await getDetector();
    for (const f of [await downscale(file, 2000), await rotated(file, 2000), file]) {
      if (!f) continue;
      try {
        const r = await det.detect(await createImageBitmap(f));
        const hit = r.map((x) => x.rawValue).find(okCode);
        if (hit) return hit;
      } catch (e) { /* next version */ }
    }
  } catch (e) { /* fall back to the older reader */ }
  await ensureScanLib();
  let el = document.getElementById("bc-reader");
  if (!el) {
    el = document.createElement("div");
    el.id = "bc-reader";
    el.style.cssText = "position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden";
    document.body.appendChild(el);
  }
  const F = window.Html5QrcodeSupportedFormats;
  const h = new window.Html5Qrcode("bc-reader", { formatsToSupport: [F.EAN_13, F.UPC_A, F.UPC_E, F.EAN_8], verbose: false });
  // Try a few sizes and a sideways turn before giving up
  const tries = [await downscale(file, 1600), await downscale(file, 1000), await rotated(file, 1400), await downscale(file, 2400)].filter(Boolean);
  try {
    for (const f of tries) {
      try { return await h.scanFile(f, false); } catch (e) { /* try the next version */ }
    }
    throw new Error("No barcode found");
  } finally { try { h.clear(); } catch (e) { /* ignore */ } }
}

// ---------- GameUPC: free crowdsourced barcode -> BGG lookup ----------
const GAMEUPC = "https://api.gameupc.com/test/upc/";
const GAMEUPC_HEADERS = { "x-api-key": "test_test_test_test_test" };
const deviceId = () => {
  try {
    let id = localStorage.getItem("gameshelf-device");
    if (!id) { id = "gameshelf-" + uid() + uid(); localStorage.setItem("gameshelf-device", id); }
    return id;
  } catch (e) { return "gameshelf-anon"; }
};
async function gameUpc(code, search) {
  const r = await fetch(GAMEUPC + enc(code) + (search ? `?search=${enc(search)}` : ""), { headers: GAMEUPC_HEADERS });
  if (!r.ok) throw new Error(`GameUPC ${r.status}`);
  return r.json();
}
const upcGame = (item) => ({
  name: item.name,
  bggId: item.id != null ? String(item.id) : null,
  year: item.published || item.year || null,
  image: [item.image_url, item.thumbnail_url, item.image, item.thumbnail].find((u) => typeof u === "string" && /^https:\/\//.test(u)) || null,
  updateUrl: item.update_url || null,
  conf: typeof item.confidence === "number" ? item.confidence : null,
});
// Picks a match without asking when the answer is clear. Returns null when unsure.
const EXP_WORDS = /\b(expansion|extension|exp\.|add-on|addon)\b/i;
const pickConfident = (data, list) => {
  if (!list.length) return null;
  if (data.bgg_info_status === "verified") return list[0];
  const title = String(data.searched_for || data.name || "");
  const t = norm(title);
  // Names that appear inside the store's product title; the longest (most specific) wins
  const inTitle = t ? list.filter((o) => norm(o.name).length >= 4 && t.includes(norm(o.name))) : [];
  let pick = inTitle.sort((a, b) => norm(b.name).length - norm(a.name).length)[0] || null;
  if (!pick && list.length === 1 && t) pick = list[0];
  if (!pick && list[0].conf != null && list[0].conf >= 0.8 && list[0].conf - (list[1]?.conf ?? 0) >= 0.2) pick = list[0];
  // Don't file an expansion as its base game
  if (pick && EXP_WORDS.test(title) && !EXP_WORDS.test(pick.name) && !/:/.test(pick.name)) return null;
  return pick;
};
// Tells GameUPC which game this barcode is, so the next person gets a verified match
const confirmUpc = (game) => {
  if (!game.updateUrl) return;
  fetch(game.updateUrl, {
    method: "POST",
    headers: { ...GAMEUPC_HEADERS, "Content-Type": "application/json" },
    body: JSON.stringify({ user_id: deviceId() }),
  }).catch(() => {});
};

// ---------- Continuous camera (reused by shelf scanning) ----------
function useBarcodeCamera(active, videoRef, onCode, onError) {
  const codeRef = useRef(onCode); codeRef.current = onCode;
  const errRef = useRef(onError); errRef.current = onError;
  useEffect(() => {
    if (!active) return;
    let stream = null;
    let stopped = false;
    let timer = null;
    (async () => {
      let det = null;
      try { det = await getDetector(); } catch (e) { det = null; }
      if (stopped) return;
      if (!det) { errRef.current("The scanner engine couldn't load. Check your connection and try again."); return; }
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
        });
      } catch (e) {
        if (!stopped) errRef.current("The camera couldn't start. Allow camera access for this site when asked (or in Settings, Apps, Safari, Camera).");
        return;
      }
      if (stopped) { stream.getTracks().forEach((t) => t.stop()); return; }
      const v = videoRef.current;
      v.srcObject = stream;
      try { await v.play(); } catch (e) { /* muted inline video can autoplay */ }
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      let n = 0;
      const tick = async () => {
        if (stopped) return;
        try {
          if (v.videoWidth) {
            n++;
            const full = n % 4 === 0;
            const cw = full ? v.videoWidth : Math.round(v.videoWidth * 0.9);
            const ch = full ? v.videoHeight : Math.round(v.videoHeight * 0.5);
            canvas.width = cw; canvas.height = ch;
            ctx.drawImage(v, (v.videoWidth - cw) / 2, (v.videoHeight - ch) / 2, cw, ch, 0, 0, cw, ch);
            const r = await det.detect(canvas);
            const hit = r.map((x) => x.rawValue).find(okCode);
            if (hit) codeRef.current(hit);
          }
        } catch (e) { /* keep going */ }
        timer = setTimeout(tick, 150);
      };
      tick();
    })();
    return () => {
      stopped = true;
      clearTimeout(timer);
      if (stream) stream.getTracks().forEach((t) => t.stop());
    };
  }, [active]);
}

function PendingRow({ entry, games, onResolve }) {
  const [name, setName] = useState("");
  const match = name.trim() ? games.find((g) => norm(g.name) === norm(name)) : null;
  return (
    <div style={{ display: "grid", gap: 6, marginTop: 6 }}>
      {(entry.options || []).map((o, i) => (
        <button key={i} className="chip" style={{ justifySelf: "start", textAlign: "left" }} onClick={() => { confirmUpc(o); onResolve(entry.code, o); }}>
          {o.name}{o.year ? ` (${o.year})` : ""}
        </button>
      ))}
      <div className="bar" style={{ margin: 0 }}>
        <input list="owned-names" placeholder="Type the game name" value={name} onChange={(e) => setName(e.target.value)} aria-label="Game name" />
        <button className="btn ghost" disabled={!name.trim()} onClick={() => onResolve(entry.code, { name: name.trim() })}>{match ? "Link" : "Add"}</button>
      </div>
      <a className="hint" style={{ margin: 0 }} href={webSearch(`${entry.code} board game`)} target="_blank" rel="noreferrer">Look up barcode {entry.code} on the web</a>
    </div>
  );
}

function ShelfScan({ games, wishes, sold = [], locations, onClose, onAssign, onAddNew, onRelink }) {
  const [loc, setLoc] = useState("");
  const [age, setAge] = useState("1");
  const [running, setRunning] = useState(false);
  const [err, setErr] = useState("");
  const [log, setLog] = useState([]);
  const videoRef = useRef(null);
  const seen = useRef(new Set());
  const queue = useRef(Promise.resolve());
  const gamesRef = useRef(games); gamesRef.current = games;
  const wishesRef = useRef(wishes); wishesRef.current = wishes;
  const soldRef = useRef(sold); soldRef.current = sold;
  const locRef = useRef(loc); locRef.current = loc;
  const ageRef = useRef(age); ageRef.current = age;

  const push = (code, entry) => setLog((l) => [{ code, ...entry }, ...l.filter((x) => x.code !== code)]);

  const place = (code, info, guessOptions = null) => {
    const where = locRef.current.trim();
    const guess = guessOptions ? { guess: true, options: guessOptions } : {};
    const mine = gamesRef.current.find((g) => (info.bggId && String(g.bgg?.id) === String(info.bggId)) || norm(g.name) === norm(info.name));
    if (mine) {
      const same = (mine.location || "").trim() === where;
      onAssign(mine.id, where, code, info);
      push(code, { name: mine.name, status: same ? "Already here" : mine.location ? `Moved from ${mine.location}` : "Location set", id: mine.id, existed: true, ...guess });
    } else {
      const id = onAddNew(info, code, where, Number(ageRef.current));
      push(code, { name: info.name, status: guessOptions ? "Added to shelf (best match)" : "Added to shelf", id, ...guess });
    }
  };
  // Fix a best-match guess: a game it added is corrected in place; otherwise place the right one
  const fixGuess = (entry, info) => {
    if (entry.id && !entry.existed) {
      onRelink(entry.id, info, entry.code);
      push(entry.code, { name: info.name, status: "Corrected", id: entry.id });
    } else {
      place(entry.code, info);
    }
  };

  const processCode = async (code) => {
    const known = gamesRef.current.find((g) => sameCode(g.upc, code));
    if (known) { place(code, { name: known.name, bggId: known.bgg?.id }); return; }
    const w = wishesRef.current.find((g) => sameCode(g.upc, code));
    if (w) { push(code, { name: w.name, status: "On your wish list, skipped", warn: true }); return; }
    const sd = (soldRef.current || []).find((g) => sameCode(g.upc, code));
    if (sd) { push(code, { name: sd.name, status: `${soldLine(sd)}, skipped`, warn: true }); return; }
    push(code, { name: `Barcode ${code}`, status: "Looking up…" });
    try {
      const data = await gameUpc(code);
      const list = (data.bgg_info || []).map(upcGame).filter((x) => x.name);
      const sure = pickConfident(data, list);
      if (sure) place(code, sure, data.bgg_info_status !== "verified" ? list.slice(0, 4) : null);
      else push(code, { name: list[0] ? `Maybe ${list[0].name}?` : `Barcode ${code}`, status: "Needs a name", pending: true, options: list.slice(0, 3) });
    } catch (e) {
      push(code, { name: `Barcode ${code}`, status: "Needs a name (lookup failed)", pending: true, options: [] });
    }
  };

  const onCode = (code) => {
    if (seen.current.has(code)) return;
    seen.current.add(code);
    if (navigator.vibrate) navigator.vibrate(50);
    queue.current = queue.current.then(() => processCode(code)).catch(() => {});
  };

  useBarcodeCamera(running, videoRef, onCode, (msg) => { setErr(msg); setRunning(false); });

  const resolve = (code, info) => place(code, info);
  const [fixing, setFixing] = useState("");
  const done = log.filter((x) => !x.pending && !x.warn && x.status !== "Looking up…").length;
  const pending = log.filter((x) => x.pending).length;

  return (
    <div className="sheet">
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <b style={{ fontSize: 17 }}>{running ? `Scanning into: ${loc}` : "Scan a shelf"}</b>
        <button className="x" onClick={() => { setRunning(false); onClose(); }}>Close</button>
      </div>

      {!running && (
        <>
          <label className="f">Location for everything you scan
            <input list="shelfscan-locs" value={loc} onChange={(e) => setLoc(e.target.value)} placeholder="e.g. Basement shelf" />
            <datalist id="shelfscan-locs">{locations.map((l) => <option key={l} value={l} />)}</datalist>
          </label>
          <label className="f">New games found: when did you get them?
            <select value={age} onChange={(e) => setAge(e.target.value)}>
              {AGE_OPTIONS.map(([v, l]) => <option key={v} value={v}>{l}</option>)}
            </select>
          </label>
          <button className="btn felt" style={{ padding: 14 }} disabled={!loc.trim()} onClick={() => { setErr(""); setRunning(true); }}>
            {log.length ? "Keep scanning" : "Start scanning"}
          </button>
          {err && <p style={{ margin: 0, color: "var(--tag)", fontSize: 14 }}>{err}</p>}
        </>
      )}

      {running && (
        <>
          <div style={{ position: "relative", width: "100%", borderRadius: 8, overflow: "hidden", background: "#000" }}>
            <video ref={videoRef} playsInline muted autoPlay style={{ width: "100%", height: 260, objectFit: "cover", display: "block" }} />
            <div aria-hidden="true" style={{ position: "absolute", left: "6%", right: "6%", top: "32%", bottom: "32%", border: "3px solid var(--meeple)", borderRadius: 8, boxShadow: "0 0 0 999px rgba(0,0,0,.25)" }} />
          </div>
          <p className="hint" style={{ margin: 0 }}>Move from box to box. Each barcode is handled as soon as it's read, and repeats are ignored.</p>
          <button className="btn" onClick={() => setRunning(false)}>Done scanning</button>
        </>
      )}

      {log.length > 0 && (
        <>
          <p style={{ margin: "4px 0 0", fontWeight: 700 }}>
            {done} placed in {loc || "this location"}{pending ? `, ${pending} need${pending === 1 ? "s" : ""} a name` : ""}
          </p>
          <datalist id="owned-names">{games.map((g) => <option key={g.id} value={g.name} />)}</datalist>
          <ul className="plays" style={{ gap: 8 }}>
            {log.map((x) => (
              <li key={x.code} style={{ display: "block", borderTop: "1px solid var(--line)", paddingTop: 6 }}>
                <b>{x.name}</b>{" "}
                <span style={{ color: x.pending || x.warn ? "var(--tag)" : "var(--muted)", fontSize: 13.5 }}>{x.status}</span>
                {x.pending && <PendingRow entry={x} games={games} onResolve={resolve} />}
                {x.guess && fixing !== x.code && <button className="x" style={{ padding: 0, marginLeft: 6 }} onClick={() => setFixing(x.code)}>Wrong game?</button>}
                {x.guess && fixing === x.code && (
                  <PendingRow entry={x} games={games} onResolve={(code, info) => { setFixing(""); fixGuess(x, info); }} />
                )}
              </li>
            ))}
          </ul>
        </>
      )}
    </div>
  );
}

function Scanner({ games, wishes, sold = [], onClose, onAdd, onAddWish, onBought, onOpen, logPlay, onLink, onRestore, onStoreInBox }) {
  // idle | reading | looking | local | found | choose | manual
  const [stage, setStage] = useState("idle");
  const [code, setCode] = useState("");
  const [manual, setManual] = useState("");
  const [err, setErr] = useState("");
  const [name, setName] = useState("");
  const [age, setAge] = useState("1");
  const [game, setGame] = useState(null);
  const [options, setOptions] = useState([]);
  const [searchTerms, setSearchTerms] = useState("");
  const [note, setNote] = useState("");
  const [storePrice, setStorePrice] = useState("");

  const ownedMatch = (gm) => gm && games.find((g) => (gm.bggId && String(g.bgg?.id) === gm.bggId) || norm(g.name) === norm(gm.name));
  const wishMatch = (gm) => gm && wishes.find((g) => (gm.bggId && String(g.bgg?.id) === gm.bggId) || norm(g.name) === norm(gm.name));
  const linkAny = (gm, c) => { const hit = ownedMatch(gm) || wishMatch(gm); if (hit) onLink(hit.id, c, gm); };
  const reset = () => { setStorePrice(""); setStage("idle"); setErr(""); setName(""); setManual(""); setCode(""); setGame(null); setOptions([]); setSearchTerms(""); setNote(""); };
  const liveDone = useRef(false);

  const showGame = (gm) => {
    setGame(gm);
    linkAny(gm, code || gm._code);
    setStage("found");
  };

  const lookup = async (raw) => {
    const c = (raw || "").replace(/\D/g, "");
    if (c.length < 8) { setErr("That doesn't look like a full barcode number."); setStage("idle"); return; }
    setCode(c); setErr("");
    if (games.find((g) => sameCode(g.upc, c)) || wishes.find((g) => sameCode(g.upc, c)) || sold.find((g) => sameCode(g.upc, c))) { setStage("local"); return; }
    setStage("looking");
    try {
      const data = await gameUpc(c);
      const list = (data.bgg_info || []).map(upcGame).filter((x) => x.name);
      const sure = pickConfident(data, list);
      if (sure) {
        const gm = { ...sure, _code: c, _guess: data.bgg_info_status !== "verified" };
        setOptions(list.slice(0, 6));
        setSearchTerms(data.searched_for || "");
        setGame(gm);
        linkAny(gm, c);
        setStage("found");
      } else if (list.length) {
        setOptions(list.slice(0, 6));
        setSearchTerms(data.searched_for || "");
        setStage("choose");
      } else {
        setSearchTerms(data.searched_for || "");
        setNote(`The barcode database doesn't know ${c} yet. Search by name below, or type the name yourself.`);
        setStage("choose");
      }
    } catch (e) {
      setNote(`Couldn't reach the barcode database (${e.message}), so name it yourself.`);
      setStage("manual");
    }
  };

  const research = async () => {
    if (!searchTerms.trim()) return;
    setStage("looking");
    try {
      const data = await gameUpc(code, searchTerms.trim());
      const list = (data.bgg_info || []).map(upcGame).filter((x) => x.name);
      setOptions(list.slice(0, 6));
      setNote(list.length ? "" : `Nothing found for "${searchTerms}". Try different words.`);
    } catch (e) {
      setNote("Search didn't go through. Try again, or name it yourself.");
    }
    setStage("choose");
  };

  const choose = (gm) => { confirmUpc(gm); showGame(gm); };

  const onPhoto = async (file) => {
    setStage("reading"); setErr("");
    try { await lookup(await decodeBarcode(file)); }
    catch (e) {
      setErr("Couldn't read a barcode in that photo. Get close so the barcode fills most of the frame, keep it flat, and avoid glare. Or type the numbers under the bars below.");
      setStage("idle");
    }
  };

  // Live camera: reads the middle of each frame until a valid barcode shows up
  const videoRef = useRef(null);
  useEffect(() => {
    if (stage !== "live") return;
    let stream = null;
    let stopped = false;
    let timer = null;
    liveDone.current = false;
    (async () => {
      let det = null;
      try { det = await getDetector(); } catch (e) { det = null; }
      if (stopped) return;
      if (!det) { setErr("The scanner engine couldn't load. Check your connection, or take a photo instead."); setStage("idle"); return; }
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
        });
      } catch (e) {
        if (!stopped) { setErr("The camera couldn't start. Allow camera access for this site when asked (or in Settings, Apps, Safari, Camera), or take a photo instead."); setStage("idle"); }
        return;
      }
      if (stopped) { stream.getTracks().forEach((t) => t.stop()); return; }
      const v = videoRef.current;
      v.srcObject = stream;
      try { await v.play(); } catch (e) { /* autoplay is allowed for muted inline video */ }
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      let n = 0;
      const tick = async () => {
        if (stopped || liveDone.current) return;
        try {
          if (v.videoWidth) {
            n++;
            // Mostly scan the middle band (faster, fewer misreads); every 4th frame check the whole view
            const full = n % 4 === 0;
            const cw = full ? v.videoWidth : Math.round(v.videoWidth * 0.9);
            const ch = full ? v.videoHeight : Math.round(v.videoHeight * 0.5);
            canvas.width = cw; canvas.height = ch;
            ctx.drawImage(v, (v.videoWidth - cw) / 2, (v.videoHeight - ch) / 2, cw, ch, 0, 0, cw, ch);
            const r = await det.detect(canvas);
            const hit = r.map((x) => x.rawValue).find(okCode);
            if (hit && !liveDone.current) {
              liveDone.current = true;
              if (navigator.vibrate) navigator.vibrate(60);
              stream.getTracks().forEach((t) => t.stop());
              lookup(hit);
              return;
            }
          }
        } catch (e) { /* keep trying */ }
        timer = setTimeout(tick, 100);
      };
      tick();
    })();
    return () => {
      stopped = true;
      clearTimeout(timer);
      if (stream) stream.getTracks().forEach((t) => t.stop());
    };
  }, [stage]);

  const local = code ? games.find((g) => sameCode(g.upc, code)) : null;
  const localWish = code && !local ? wishes.find((g) => sameCode(g.upc, code)) : null;
  const localSold = code && !local && !localWish ? sold.find((g) => sameCode(g.upc, code)) : null;
  const mine = stage === "found" ? ownedMatch(game) : null;
  const wished = stage === "found" && !mine ? wishMatch(game) : null;
  const soldMatch = stage === "found" && !mine && !wished && game
    ? sold.find((g) => (game.bggId && String(g.bgg?.id) === game.bggId) || norm(g.name) === norm(game.name)) : null;
  const nameMatch = name.trim() ? games.find((g) => norm(g.name) === norm(name)) : null;
  const ageSelect = (
    <label className="f">When did you get it?
      <select value={age} onChange={(e) => setAge(e.target.value)}>
        {AGE_OPTIONS.map(([v, l]) => <option key={v} value={v}>{l}</option>)}
      </select>
    </label>
  );
  const onShelf = (g) => (
    <>
      <p style={{ margin: 0 }}>{g.inBox ? `You own this. It's stored in ${g.storedIn ? `the ${g.storedIn} box` : "another box"}.` : "Already on your shelf."}</p>
      <div className="bar" style={{ margin: 0, flexWrap: "wrap" }}>
        <button className="btn felt" onClick={() => { logPlay(g); onClose(); }}>Log a play</button>
        <button className="btn ghost" onClick={() => onOpen(g.id)}>Open it</button>
        {g.bgg?.id && <a className="btn ghost" href={bggUrl(g.bgg, g.name)} target="_blank" rel="noreferrer">View on BGG</a>}
      </div>
      {!g.inBox && <button className="x" style={{ justifySelf: "start", padding: 0, color: "var(--ink)" }} onClick={() => { onStoreInBox(g.id); onClose(); }}>Expansion stored in another box? Mark it</button>}
    </>
  );
  const onSold = (g) => (
    <>
      <p style={{ margin: 0, fontWeight: 700, color: "var(--tag)" }}>You already had this one. {soldLine(g)}.</p>
      <div className="bar" style={{ margin: 0, flexWrap: "wrap" }}>
        <button className="btn ghost" onClick={() => { onRestore(g); onClose(); }}>Bought it back</button>
        <button className="btn ghost" onClick={() => onAddWish({ name: g.name, bggId: g.bgg?.id }, code)}>Add to wish list</button>
        {g.bgg?.id && <a className="btn ghost" href={bggUrl(g.bgg, g.name)} target="_blank" rel="noreferrer">View on BGG</a>}
      </div>
    </>
  );
  const onWish = (g) => (
    <>
      <p style={{ margin: 0 }}>On your wish list: {wishLine(g).replace("MSRP", "msrp").toLowerCase().replace("msrp", "MSRP")}.</p>
      {g.note && <p className="hint" style={{ margin: 0 }}>{g.note}</p>}
      <label className="f">Price on the shelf
        <input inputMode="decimal" placeholder="$" value={storePrice} onChange={(e) => setStorePrice(e.target.value.replace(/[^0-9.]/g, ""))} />
      </label>
      {Number(storePrice) > 0 && (g.msrp || g.maxPrice) ? (
        <p style={{ margin: 0, fontWeight: 700, color: g.maxPrice && Number(storePrice) > g.maxPrice ? "var(--tag)" : "var(--felt)" }}>
          {priceVerdict(g, Number(storePrice))}
        </p>
      ) : Number(storePrice) > 0 ? <p className="hint" style={{ margin: 0 }}>Add an MSRP or a price limit to this game to compare.</p> : null}
      <div className="bar" style={{ margin: 0, flexWrap: "wrap" }}>
        <button className="btn felt" onClick={() => { onBought(g); onClose(); }}>We bought it</button>
        <button className="btn ghost" onClick={() => onOpen(g.id)}>Open it</button>
        {g.bgg?.id && <a className="btn ghost" href={bggUrl(g.bgg, g.name)} target="_blank" rel="noreferrer">View on BGG</a>}
      </div>
    </>
  );
  const again = <button className="x" style={{ justifySelf: "start", padding: 0, color: "var(--ink)" }} onClick={reset}>Scan another</button>;

  return (
    <div className="sheet">
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <b style={{ fontSize: 17 }}>Scan a barcode</b>
        <button className="x" onClick={onClose}>Close</button>
      </div>

      {stage === "idle" && (
        <>
          <button className="btn felt" style={{ padding: 14 }} onClick={() => { setErr(""); setStage("live"); }}>Scan with camera</button>
          <label className="btn ghost filebtn">
            Take a photo instead
            <input type="file" accept="image/*" capture="environment" hidden onChange={(e) => { const f = e.target.files[0]; e.target.value = ""; f && onPhoto(f); }} />
          </label>
          <div className="bar" style={{ margin: 0 }}>
            <input inputMode="numeric" placeholder="Or type the barcode numbers" value={manual} onChange={(e) => setManual(e.target.value)} onKeyDown={(e) => e.key === "Enter" && lookup(manual)} aria-label="Barcode number" />
            <button className="btn ghost" onClick={() => lookup(manual)}>Go</button>
          </div>
          {err && <p style={{ margin: 0, color: "var(--tag)", fontSize: 14 }}>{err}</p>}
        </>
      )}

      {stage === "live" && (
        <>
          <div style={{ position: "relative", width: "100%", borderRadius: 8, overflow: "hidden", background: "#000" }}>
            <video ref={videoRef} playsInline muted autoPlay style={{ width: "100%", height: 320, objectFit: "cover", display: "block" }} />
            <div aria-hidden="true" style={{ position: "absolute", left: "6%", right: "6%", top: "32%", bottom: "32%", border: "3px solid var(--meeple)", borderRadius: 8, boxShadow: "0 0 0 999px rgba(0,0,0,.25)" }} />
          </div>
          <p className="hint" style={{ margin: 0 }}>Fit the barcode inside the box, about 5 to 8 inches away, and hold steady. It scans on its own.</p>
          <button className="btn ghost" onClick={() => setStage("idle")}>Cancel</button>
        </>
      )}

      {stage === "reading" && <p style={{ margin: 0 }} role="status">Reading the barcode…</p>}
      {stage === "looking" && <p style={{ margin: 0 }} role="status">Looking up {code}…</p>}

      {stage === "local" && (local || localWish || localSold) && (
        <>
          <div className="pick"><b>{(local || localWish || localSold).name}</b></div>
          {local ? onShelf(local) : localWish ? onWish(localWish) : onSold(localSold)}
          {again}
        </>
      )}

      {stage === "found" && game && (
        <>
          <div className="pick">
            {game.image && <img src={game.image} alt="" style={{ width: 48, height: 48, objectFit: "contain" }} onError={(e) => (e.target.style.display = "none")} />}
            <span><b>{game.name}</b>{game.year ? ` (${game.year})` : ""}</span>
          </div>
          {mine ? onShelf(mine) : wished ? onWish(wished) : soldMatch ? onSold(soldMatch) : (
            <>
              {ageSelect}
              <div className="bar" style={{ margin: 0, flexWrap: "wrap" }}>
                <button className="btn" onClick={() => onAdd(game, code, Number(age))}>Add to shelf</button>
                <button className="btn ghost" onClick={() => onAddWish(game, code)}>Add to wish list</button>
                <button className="btn ghost" onClick={() => onAdd(game, code, Number(age), { inBox: true })}>Expansion in another box</button>
                {game.bggId && <a className="btn ghost" href={bggUrl({ id: game.bggId }, game.name)} target="_blank" rel="noreferrer">View on BGG</a>}
              </div>
            </>
          )}
          {game._guess && <p className="hint" style={{ margin: 0 }}>Best match from the barcode's product name. Not right? Tap Wrong game.</p>}
          <button className="x" style={{ justifySelf: "start", padding: 0 }} onClick={() => { setName(""); setStage(options.length ? "choose" : "manual"); }}>Wrong game?</button>
          {again}
        </>
      )}

      {stage === "choose" && (
        <>
          <p style={{ margin: 0 }}>{note || "Which game is this? Your pick also helps confirm it in the shared barcode database."}</p>
          {options.map((o, i) => (
            <button key={i} className="pick" style={{ textAlign: "left", cursor: "pointer", color: "var(--ink)" }} onClick={() => choose(o)}>
              {o.image && <img src={o.image} alt="" style={{ width: 44, height: 44, objectFit: "contain" }} onError={(e) => (e.target.style.display = "none")} />}
              <span><b>{o.name}</b>{o.year ? ` (${o.year})` : ""}</span>
            </button>
          ))}
          <div className="bar" style={{ margin: 0 }}>
            <input placeholder="Search by name" value={searchTerms} onChange={(e) => setSearchTerms(e.target.value)} onKeyDown={(e) => e.key === "Enter" && research()} aria-label="Search by name" />
            <button className="btn ghost" onClick={research}>Search</button>
          </div>
          <button className="x" style={{ justifySelf: "start", padding: 0 }} onClick={() => setStage("manual")}>Just type the name myself</button>
          {again}
        </>
      )}

      {stage === "manual" && (
        <>
          <p style={{ margin: 0 }}>{note || `Name barcode ${code} once and future scans of this box will find it instantly.`}</p>
          <a className="btn ghost" href={webSearch(`${code} board game`)} target="_blank" rel="noreferrer">Look up this barcode on the web</a>
          <label className="f">Game name
            <input list="owned-names" value={name} onChange={(e) => setName(e.target.value)} placeholder="Type or pick from your shelf" />
            <datalist id="owned-names">{games.map((g) => <option key={g.id} value={g.name} />)}</datalist>
          </label>
          {!nameMatch && ageSelect}
          <button className="btn" disabled={!name.trim()} onClick={() => onAdd({ name: name.trim() }, code, Number(age))}>
            {nameMatch ? `Link barcode to ${nameMatch.name}` : "Add to shelf"}
          </button>
          {!nameMatch && <button className="btn ghost" disabled={!name.trim()} onClick={() => onAddWish({ name: name.trim() }, code)}>Add to wish list</button>}
          {again}
        </>
      )}
    </div>
  );
}

function BarcodeFix({ g, upd, onRelink }) {
  const [open, setOpen] = useState(false);
  const [loading, setLoading] = useState(false);
  const [options, setOptions] = useState([]);
  const [err, setErr] = useState("");
  const [name, setName] = useState("");
  const load = async () => {
    setOpen(true); setLoading(true); setErr("");
    try {
      const data = await gameUpc(g.upc);
      setOptions((data.bgg_info || []).map(upcGame).filter((x) => x.name).slice(0, 6));
    } catch (e) { setErr(`Couldn't reach the barcode database (${e.message}). You can still type the right name.`); }
    setLoading(false);
  };
  const choose = (info, vote) => {
    if (vote) confirmUpc(info);
    onRelink(g.id, info, g.upc);
    setOpen(false); setOptions([]); setName("");
  };
  return (
    <div>
      <label className="f">Barcode</label>
      <p style={{ margin: "4px 0 6px" }}>{g.upc}</p>
      {!open ? (
        <div className="bar" style={{ margin: 0, flexWrap: "wrap" }}>
          <button className="btn ghost" onClick={load}>Wrong game? Pick again</button>
          <button className="x" style={{ padding: 0 }} onClick={() => upd(g.id, (x) => ({ ...x, upc: undefined }))}>Forget barcode</button>
        </div>
      ) : (
        <div style={{ display: "grid", gap: 6 }}>
          {loading && <p className="hint" style={{ margin: 0 }}>Looking up the barcode…</p>}
          {err && <p className="hint" style={{ margin: 0, color: "var(--tag)" }}>{err}</p>}
          {options.filter((o) => String(o.bggId) !== String(g.bgg?.id)).map((o, i) => (
            <button key={i} className="pick" style={{ textAlign: "left", cursor: "pointer", color: "var(--ink)", background: "var(--card)" }} onClick={() => choose(o, true)}>
              {o.image && <img src={o.image} alt="" style={{ width: 40, height: 40, objectFit: "contain" }} onError={(e) => (e.target.style.display = "none")} />}
              <span><b>{o.name}</b>{o.year ? ` (${o.year})` : ""}</span>
            </button>
          ))}
          {!loading && !err && options.length === 0 && <p className="hint" style={{ margin: 0 }}>No other suggestions for this barcode. Type the right name below.</p>}
          <div className="bar" style={{ margin: 0 }}>
            <input placeholder="Or type the right game name" value={name} onChange={(e) => setName(e.target.value)} aria-label="Right game name" />
            <button className="btn ghost" disabled={!name.trim()} onClick={() => choose({ name: name.trim() }, false)}>Fix</button>
          </div>
          <button className="x" style={{ justifySelf: "start", padding: 0, color: "var(--ink)" }} onClick={() => setOpen(false)}>Cancel</button>
          <p className="hint" style={{ margin: 0 }}>Fixing keeps this game's plays, location, and other details, and updates its name, BGG link, box art, and price.</p>
        </div>
      )}
    </div>
  );
}

class SafeDetail extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(error) { return { error }; }
  render() {
    if (this.state.error) {
      return (
        <div className="detail">
          <p style={{ margin: 0, color: "var(--tag)" }}>This game's details hit an error: {String(this.state.error.message || this.state.error)}. The rest of the app still works. Send a screenshot of this to get it fixed.</p>
        </div>
      );
    }
    return <Detail {...this.props} />;
  }
}

        <a className="btn ghost" href={bggSearch(bggQuery.trim() || fullName(g))} target="_blank" rel="noreferrer">Search BGG</a>
        <a className="btn ghost" href={bggViaGoogle(bggQuery.trim() || g.name)} target="_blank" rel="noreferrer">Search with Google</a>
      </div>
      <div className="bar" style={{ margin: "8px 0 0" }}>
        <input placeholder="Paste BGG page link" value={bggLink} onChange={(e) => setBggLink(e.target.value.trim())} aria-label="BGG page link" />
        <button className="btn ghost" disabled={!parseBgg(bggLink)} onClick={() => { upd(g.id, (x) => ({ ...x, bgg: parseBgg(bggLink), bggNone: false, review: undefined })); setBggLink(""); }}>Save</button>
      </div>
      {bggLink && !parseBgg(bggLink) && <p className="hint" style={{ color: "var(--tag)" }}>That doesn't look like a BGG game page link.</p>}
