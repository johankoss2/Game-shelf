<script>
// Device storage (IndexedDB) with the same get/set/delete shape the app uses
(function () {
  var dbp;
  function open() {
    return new Promise(function (res, rej) {
      var r = indexedDB.open("game-shelf", 1);
      r.onupgradeneeded = function () { r.result.createObjectStore("kv"); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
  }
  function tx(mode, fn) {
    dbp = dbp || open();
    return dbp.then(function (db) {
      return new Promise(function (res, rej) {
        var t = db.transaction("kv", mode), req = fn(t.objectStore("kv"));
        t.oncomplete = function () { res(req && req.result); };
        t.onerror = function () { rej(t.error); };
      });
    });
  }
  window.storage = {
    get: function (key) {
      return tx("readonly", function (s) { return s.get(key); }).then(function (v) {
        if (v === undefined) throw new Error("not found");
        return { key: key, value: v, shared: false };
      });
    },
    set: function (key, value) {
      return tx("readwrite", function (s) { return s.put(value, key); }).then(function () { return { key: key, value: value, shared: false }; });
    },
    delete: function (key) {
      return tx("readwrite", function (s) { return s.delete(key); }).then(function () { return { key: key, deleted: true, shared: false }; });
    }
  };
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
})();
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef } = React;

const APP_VERSION = "1.4";
const KEY = "boardgame-shelf-v1";
const ART_KEY = "boardgame-art-v1";
const SYNC_KEY = "boardgame-sync-v1";
const CONDITIONS = ["Sealed", "Like new", "Good", "Well-loved"];
const AGE_OPTIONS = [["0", "Recently"], ["1", "About a year ago"], ["2", "2+ years ago"], ["5", "5+ years ago"]];
const uid = () => Math.random().toString(36).slice(2, 10);
const today = () => new Date().toISOString().slice(0, 10);
const yearsAgo = (n) => { const d = new Date(); d.setFullYear(d.getFullYear() - n); return d.toISOString().slice(0, 10); };
const norm = (s) => (s || "").toLowerCase().replace(/[^a-z0-9]/g, "");
const daysSince = (d) => Math.max(0, Math.floor((Date.now() - new Date(d + "T12:00:00").getTime()) / 86400000));
const lastPlayed = (g) => (g.plays.length ? g.plays.map((p) => p.date).sort().at(-1) : null);
const idleDays = (g) => daysSince(lastPlayed(g) || g.ownedSince);
const ago = (d) =>
  d < 1 ? "today" : d < 2 ? "yesterday" : d < 30 ? `${d} days ago` : d < 365
    ? `${Math.round(d / 30)} month${Math.round(d / 30) === 1 ? "" : "s"} ago`
    : `${(d / 365).toFixed(1).replace(/\.0$/, "")} years ago`;
const idleLabel = (g) => {
  const lp = lastPlayed(g);
  if (lp) return `Played ${ago(daysSince(lp))}`;
  const owned = daysSince(g.ownedSince);
  return owned < 1 ? "Never played, added today" : `Never played, owned since ${ago(owned)}`;
};
const sameCode = (a, b) => a && b && a.replace(/^0+/, "") === b.replace(/^0+/, "");

// ---------- Outside links (no keys, no accounts) ----------
const enc = encodeURIComponent;
const bggSearch = (name) => `https://boardgamegeek.com/geeksearch.php?action=search&objecttype=boardgame&q=${enc(name)}`;
const slugify = (s) => (s || "").toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");
// Full game link (id + name), like BGG's own. web=true uses www. so iPhone keeps it in Safari instead of the BGG app
const bggUrl = (b, name, web = false) => `https://${web ? "www." : ""}boardgamegeek.com/boardgame/${b.id}/${b.slug || slugify(name)}`;
const parseBgg = (url) => {
  const m = (url || "").match(/boardgamegeek\.com\/boardgame(?:expansion)?\/(\d+)(?:\/([^/?#\s]+))?/i);
  return m ? { id: m[1], slug: m[2] || "" } : null;
};
const ebaySold = (name) => `https://www.ebay.com/sch/i.html?_nkw=${enc(name + " board game")}&LH_Sold=1&LH_Complete=1`;
const fbSearch = (name) => `https://www.facebook.com/marketplace/search/?query=${enc(name + " board game")}`;
const webSearch = (q) => `https://www.google.com/search?q=${enc(q)}`;
const fullName = (g) => (g.edition ? `${g.name} ${g.edition}` : g.name);
const PRIORITIES = ["Must have", "Want", "Maybe"];
const shopSearch = (name) => `https://www.google.com/search?tbm=shop&q=${enc(name + " board game")}`;
const wishLine = (g) => [g.priority || "Want", g.msrp ? `MSRP $${g.msrp}` : null, g.market?.low ? `new from $${g.market.low}` : null, g.maxPrice ? `would pay up to $${g.maxPrice}` : null].filter(Boolean).join(", ");
const msrpSearch = (name) => webSearch(`${name} board game MSRP`);
// Compares a store price to MSRP and the price limit, e.g. "25% off MSRP, within your limit"
const priceVerdict = (g, price) => {
  if (!price) return "";
  const parts = [];
  if (g.msrp) {
    const pct = Math.round((1 - price / g.msrp) * 100);
    parts.push(pct > 0 ? `${pct}% off MSRP` : pct < 0 ? `${-pct}% over MSRP` : "right at MSRP");
  }
  if (g.maxPrice) parts.push(price <= g.maxPrice ? "within your limit" : `$${Math.round((price - g.maxPrice) * 100) / 100} over your limit`);
  return parts.join(", ");
};
const EDITIONS = ["1st edition", "2nd edition", "3rd edition", "Revised edition", "Anniversary edition", "Big box", "Deluxe edition", "Collector's edition"];
const bggViaGoogle = (name) => webSearch(`"${name}" board game site:boardgamegeek.com/boardgame`);

// Rule of thumb from an eBay sold price (eBay buyers also pay shipping; local buyers expect a deal)
// Used-price rule of thumb as a share of the original price, by condition
const RATES = {
  "Sealed": { garage: 0.45, marketplace: 0.8 },
  "Like new": { garage: 0.35, marketplace: 0.65 },
  "Good": { garage: 0.25, marketplace: 0.5 },
  "Well-loved": { garage: 0.15, marketplace: 0.35 },
};
const rateFor = (cond) => RATES[cond] || RATES.Good;
const estimateFrom = (base, cond) => {
  const r = rateFor(cond);
  return { garage: Math.max(1, Math.round(base * r.garage)), marketplace: Math.max(1, Math.round(base * r.marketplace)) };
};
// Original price: MSRP if entered, otherwise the new price captured when the game went on the shelf
const basePrice = (g) => g.msrp || g.market?.low || null;
const autoPrices = (g) => { const b = basePrice(g); return b ? { ...(g.prices || {}), ...estimateFrom(b, g.condition), manual: false } : g.prices; };
// BoardGamePrices.com public API: current offers by BGG ID. Their terms: link back, cache at least an hour.
async function fetchBgp(eids) {
  const site = enc(location.origin + location.pathname);
  const r = await fetch(`https://boardgameprices.com/api/info?eid=${eids.join(",")}&currency=USD&destination=US&sort=CHEAP1&preferred_language=GB&sitename=${site}`);
  if (!r.ok) throw new Error(`prices ${r.status}`);
  const d = await r.json();
  const out = {};
  (d.items || []).forEach((it) => {
    const eid = String(it.external_id || "");
    if (!eid || out[eid]) return; // first item is the preferred (English) version
    const offers = (it.prices || []).filter((p) => Number(p.price) > 0);
    const inStock = offers.filter((p) => p.stock === "Y");
    const pool = inStock.length ? inStock : offers;
    if (!pool.length) { out[eid] = { none: true, url: it.url || null, at: Date.now() }; return; }
    const totals = pool.map((p) => Number(p.price)).sort((a, b) => a - b);
    out[eid] = { low: Math.round(totals[0]), offers: pool.length, inStock: inStock.length > 0, url: it.url || null, at: Date.now() };
  });
  eids.forEach((e) => { if (!out[e]) out[e] = { none: true, at: Date.now() }; });
  return out;
}
const suggestFrom = (ebay) => ({ garage: Math.max(1, Math.round(ebay * 0.4)), marketplace: Math.max(1, Math.round(ebay * 0.65)) });

// Older data (from the Claude version) used AI estimate ranges; convert to single prices
const normalize = (g) => {
  const n = { plays: [], keep: false, status: "owned", condition: "Good", ownedSince: today(), addedAt: today(), ...g };
  if (!n.prices && n.estimate) {
    const mid = (r) => (r ? Math.round((r[0] + r[1]) / 2) : null);
    n.prices = { garage: mid(n.estimate.garage), marketplace: mid(n.estimate.marketplace) };
  }
  if (n.bgg && n.bgg.id && !n.bgg.slug) n.bgg = { id: String(n.bgg.id), slug: "" };
  delete n.estimate;
  return n;
};

// ---------- Title check via Wikidata (free, no key) ----------
// Finds games whose Wikidata entry lists a BoardGameGeek ID (property P2339).
// Uses Wikidata's standard web API, which allows calls from any web page.
const WD = "https://www.wikidata.org/w/api.php";
async function wikidataBgg(name) {
  const s = await fetch(`${WD}?action=wbsearchentities&format=json&origin=*&language=en&uselang=en&type=item&limit=20&search=${enc(name)}`);
  if (!s.ok) throw new Error(`search ${s.status}`);
  const sd = await s.json();
  const hits = sd.search || [];
  if (!hits.length) return [];
  const ids = hits.map((h) => h.id);
  const e = await fetch(`${WD}?action=wbgetentities&format=json&origin=*&languages=en&props=${enc("labels|claims")}&ids=${enc(ids.join("|"))}`);
  if (!e.ok) throw new Error(`details ${e.status}`);
  const ed = await e.json();
  const val = (ent, p) => ent.claims?.[p]?.[0]?.mainsnak?.datavalue?.value;
  const seen = new Set();
  return ids
    .map((id) => ed.entities?.[id])
    .filter(Boolean)
    .map((ent) => {
      const bgg = val(ent, "P2339");
      const t = val(ent, "P577");
      const year = t && typeof t.time === "string" ? Number(t.time.slice(1, 5)) || null : null;
      const label = ent.labels?.en?.value || hits.find((h) => h.id === ent.id)?.label;
      return { name: label, bggId: typeof bgg === "string" ? bgg : null, year };
    })
    .filter((x) => x.name && x.bggId && /^\d+$/.test(x.bggId) && !seen.has(x.bggId) && seen.add(x.bggId))
    .slice(0, 8);
}
const confirmMatch = (g, m) => ({ ...g, name: m.name, bgg: { id: String(m.bggId), slug: "", year: m.year || null }, review: undefined, bggNone: false });

// ---------- Sync through a private GitHub repo ----------
const b64encode = (str) => {
  const bytes = new TextEncoder().encode(str);
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
};
const b64decode = (b64) => {
  const bin = atob(b64.replace(/\s/g, ""));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
};
const ghHeaders = (cfg) => ({ Authorization: `Bearer ${cfg.token}`, Accept: "application/vnd.github+json" });
const ghErr = (r) => { const e = new Error(`GitHub ${r.status}`); e.status = r.status; return e; };
async function ghGet(cfg, path) {
  const url = `https://api.github.com/repos/${cfg.repo}/contents/${path}`;
  const r = await fetch(url, { headers: ghHeaders(cfg), cache: "no-store" });
  if (r.status === 404) return null;
  if (!r.ok) throw ghErr(r);
  const meta = await r.json();
  let text;
  if (meta.content && meta.encoding === "base64") text = b64decode(meta.content);
  else {
    // Files over 1 MB come back without content; fetch them raw
    const r2 = await fetch(url, { headers: { ...ghHeaders(cfg), Accept: "application/vnd.github.raw+json" }, cache: "no-store" });
    if (!r2.ok) throw ghErr(r2);
    text = await r2.text();
  }
  return { json: JSON.parse(text), sha: meta.sha };
}
async function ghPut(cfg, path, obj, sha) {
  const r = await fetch(`https://api.github.com/repos/${cfg.repo}/contents/${path}`, {
    method: "PUT",
    headers: { ...ghHeaders(cfg), "Content-Type": "application/json" },
    body: JSON.stringify({ message: `Update ${path}`, content: b64encode(JSON.stringify(obj)), ...(sha ? { sha } : {}) }),
  });
  if (!r.ok) throw ghErr(r);
  return (await r.json()).content.sha;
}
const syncError = (e) =>
  e.status === 401 ? "GitHub rejected the token. It may have expired. Make a new one and reconnect."
  : e.status === 403 ? "The token doesn't have permission. It needs Contents: Read and write on the data repo."
  : e.status === 404 ? "Couldn't find the data repo. Check the name, and that the token was given access to it."
  : !navigator.onLine ? "You're offline. Changes are saved on this phone and will sync when you're back online."
  : "Sync didn't go through. It'll try again automatically.";

// Stable comparison so key order never looks like a change
const stable = (v) =>
  Array.isArray(v) ? `[${v.map(stable).join(",")}]`
  : v && typeof v === "object" ? `{${Object.keys(v).sort().filter((k) => v[k] !== undefined).map((k) => JSON.stringify(k) + ":" + stable(v[k])).join(",")}}`
  : JSON.stringify(v ?? null);
const tidy = (s) => ({
  ...s,
  games: [...(s.games || [])].sort((a, b) => (a.id < b.id ? -1 : 1))
    .map((g) => ({ ...g, plays: [...(g.plays || [])].sort((a, b) => ((a.date + a.id) < (b.date + b.id) ? -1 : 1)) })),
});
const canon = (s) => stable(tidy(s || {}));

// Merge two shelves: plays from both are kept, other edits go to whichever is newer,
// and deletions (games, plays) stick
const mergeShelves = (a, b) => {
  if (!b) return tidy(a);
  const deleted = { ...(b.deleted || {}), ...(a.deleted || {}) };
  const byId = {};
  [...(b.games || []), ...(a.games || [])].forEach((g0) => {
    const g = normalize(g0);
    const prev = byId[g.id];
    if (!prev) { byId[g.id] = g; return; }
    const newer = (g.updatedAt || 0) >= (prev.updatedAt || 0) ? g : prev;
    const older = newer === g ? prev : g;
    const delPlays = [...new Set([...(older.deletedPlays || []), ...(newer.deletedPlays || [])])];
    const plays = {};
    [...older.plays, ...newer.plays].forEach((p) => (plays[p.id] = p));
    byId[g.id] = { ...newer, deletedPlays: delPlays, plays: Object.values(plays) };
  });
  const games = Object.values(byId)
    .filter((g) => !deleted[g.id])
    .map((g) => ({ ...g, plays: g.plays.filter((p) => !(g.deletedPlays || []).includes(p.id)) }));
  const artTimes = { ...(b.artTimes || {}) };
  Object.entries(a.artTimes || {}).forEach(([k, t]) => { if (t > (artTimes[k] || 0)) artTimes[k] = t; });
  return tidy({ ...b, ...a, games, deleted, artTimes });
};
const makeSetupCode = (cfg) => "GS1:" + btoa(JSON.stringify({ repo: cfg.repo, token: cfg.token }));
const readSetupCode = (code) => {
  try {
    const v = JSON.parse(atob(code.trim().replace(/^GS1:/, "")));
    return v.repo && v.token ? { repo: v.repo, token: v.token } : null;
  } catch (e) { return null; }
};
const sinceLabel = (t) => {
  if (!t) return "";
  const s = Math.round((Date.now() - t) / 1000);
  return s < 60 ? "just now" : s < 3600 ? `${Math.round(s / 60)} min ago` : s < 86400 ? `${Math.round(s / 3600)} hr ago` : `${Math.round(s / 86400)} days ago`;
};

// ---------- Images ----------
const loadImage = (file) =>
  new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = rej;
    img.src = url;
  });
const shrink = async (file) => {
  const img = await loadImage(file);
  const s = Math.min(1, 240 / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * s);
  c.height = Math.round(img.height * s);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.72);
};
const downscale = async (file, max) => {
  const img = await loadImage(file).catch(() => null);
  if (!img) return file;
  const s = Math.min(1, max / Math.max(img.width, img.height));
  if (s === 1) return file;
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * s);
  c.height = Math.round(img.height * s);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return new Promise((res) => c.toBlob((b) => res(b ? new File([b], "scan.jpg", { type: "image/jpeg" }) : file), "image/jpeg", 0.9));
};

// ---------- Barcode reading (on the phone, no lookup service) ----------
let bcLib = null;
const loadScript = (src) =>
  new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s);
  });
const FORMATS = ["ean_13", "upc_a", "upc_e", "ean_8"];
const DETECTOR_URLS = [
  "https://cdn.jsdelivr.net/npm/barcode-detector@2/dist/es/pure.min.js",
  "https://cdn.jsdelivr.net/npm/barcode-detector@2/+esm",
  "https://cdn.jsdelivr.net/npm/barcode-detector@3/+esm",
];
let detectorP = null;
function getDetector() {
  if (!detectorP) {
    detectorP = (async () => {
      if ("BarcodeDetector" in window) {
        try {
          const f = await window.BarcodeDetector.getSupportedFormats();
          if (f.includes("ean_13")) return new window.BarcodeDetector({ formats: FORMATS });
        } catch (e) { /* use ZXing instead */ }
      }
      for (const u of DETECTOR_URLS) {
        try {
          const m = await import(u);
          const BD = m.BarcodeDetector || (m.default && m.default.BarcodeDetector);
          if (BD) return new BD({ formats: FORMATS });
        } catch (e) { /* try the next source */ }
      }
      throw new Error("scanner engine didn't load");
    })().catch((e) => { detectorP = null; throw e; });
  }
  return detectorP;
}
// Product barcodes carry a check digit; reject anything that fails it
const validGtin = (s) => {
  if (!/^(\d{12}|\d{13})$/.test(s)) return false;
  const d = s.split("").map(Number);
  const check = d.pop();
  const sum = d.reverse().reduce((a, n, i) => a + n * (i % 2 === 0 ? 3 : 1), 0);
  return (10 - (sum % 10)) % 10 === check;
};
const okCode = (v) => !!v && (/^\d{8}$/.test(v) || validGtin(v));

async function ensureScanLib() {
  if (window.Html5Qrcode) return;
  bcLib = bcLib || loadScript("https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js");
  try { await bcLib; } catch (e) { bcLib = null; throw e; }
}
const scanFormats = () => {
  const F = window.Html5QrcodeSupportedFormats;
  return [F.EAN_13, F.UPC_A, F.UPC_E, F.EAN_8];
};
const rotated = async (file, max) => {
  const img = await loadImage(file).catch(() => null);
  if (!img) return null;
  const s = Math.min(1, max / Math.max(img.width, img.height));
  const w = Math.round(img.width * s), h = Math.round(img.height * s);
  const c = document.createElement("canvas");
  c.width = h; c.height = w;
  const x = c.getContext("2d");
  x.translate(h / 2, w / 2);
  x.rotate(Math.PI / 2);
  x.drawImage(img, -w / 2, -h / 2, w, h);
  return new Promise((res) => c.toBlob((b) => res(b ? new File([b], "turned.jpg", { type: "image/jpeg" }) : null), "image/jpeg", 0.9));
};

async function decodeBarcode(file) {
  try {
    const det = await getDetector();
    for (const f of [await downscale(file, 2000), await rotated(file, 2000), file]) {
      if (!f) continue;
      try {
        const r = await det.detect(await createImageBitmap(f));
        const hit = r.map((x) => x.rawValue).find(okCode);
        if (hit) return hit;
      } catch (e) { /* next version */ }
    }
  } catch (e) { /* fall back to the older reader */ }
  await ensureScanLib();
  let el = document.getElementById("bc-reader");
  if (!el) {
    el = document.createElement("div");
    el.id = "bc-reader";
    el.style.cssText = "position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden";
    document.body.appendChild(el);
  }
  const F = window.Html5QrcodeSupportedFormats;
  const h = new window.Html5Qrcode("bc-reader", { formatsToSupport: [F.EAN_13, F.UPC_A, F.UPC_E, F.EAN_8], verbose: false });
  // Try a few sizes and a sideways turn before giving up
  const tries = [await downscale(file, 1600), await downscale(file, 1000), await rotated(file, 1400), await downscale(file, 2400)].filter(Boolean);
  try {
    for (const f of tries) {
      try { return await h.scanFile(f, false); } catch (e) { /* try the next version */ }
    }
    throw new Error("No barcode found");
  } finally { try { h.clear(); } catch (e) { /* ignore */ } }
}

const css = `
