// ---------- GameUPC: free crowdsourced barcode -> BGG lookup ----------
const GAMEUPC = "https://api.gameupc.com/test/upc/";
const GAMEUPC_HEADERS = { "x-api-key": "test_test_test_test_test" };
const deviceId = () => {
  try {
    let id = localStorage.getItem("gameshelf-device");
    if (!id) { id = "gameshelf-" + uid() + uid(); localStorage.setItem("gameshelf-device", id); }
    return id;
  } catch (e) { return "gameshelf-anon"; }
};
async function gameUpc(code, search) {
  const r = await fetch(GAMEUPC + enc(code) + (search ? `?search=${enc(search)}` : ""), { headers: GAMEUPC_HEADERS });
  if (!r.ok) throw new Error(`GameUPC ${r.status}`);
  return r.json();
}
const upcGame = (item) => ({
  name: item.name,
  bggId: item.id != null ? String(item.id) : null,
  year: item.published || item.year || null,
  image: [item.image_url, item.thumbnail_url, item.image, item.thumbnail].find((u) => typeof u === "string" && /^https:\/\//.test(u)) || null,
  updateUrl: item.update_url || null,
});
// Tells GameUPC which game this barcode is, so the next person gets a verified match
const confirmUpc = (game) => {
  if (!game.updateUrl) return;
  fetch(game.updateUrl, {
    method: "POST",
    headers: { ...GAMEUPC_HEADERS, "Content-Type": "application/json" },
    body: JSON.stringify({ user_id: deviceId() }),
  }).catch(() => {});
};

function Scanner({ games, wishes, onClose, onAdd, onAddWish, onBought, onOpen, logPlay, onLink }) {
  // idle | reading | looking | local | found | choose | manual
  const [stage, setStage] = useState("idle");
  const [code, setCode] = useState("");
  const [manual, setManual] = useState("");
  const [err, setErr] = useState("");
  const [name, setName] = useState("");
  const [age, setAge] = useState("1");
  const [game, setGame] = useState(null);
  const [options, setOptions] = useState([]);
  const [searchTerms, setSearchTerms] = useState("");
  const [note, setNote] = useState("");
  const [storePrice, setStorePrice] = useState("");

  const ownedMatch = (gm) => gm && games.find((g) => (gm.bggId && String(g.bgg?.id) === gm.bggId) || norm(g.name) === norm(gm.name));
  const wishMatch = (gm) => gm && wishes.find((g) => (gm.bggId && String(g.bgg?.id) === gm.bggId) || norm(g.name) === norm(gm.name));
  const linkAny = (gm, c) => { const hit = ownedMatch(gm) || wishMatch(gm); if (hit) onLink(hit.id, c, gm); };
  const reset = () => { setStorePrice(""); setStage("idle"); setErr(""); setName(""); setManual(""); setCode(""); setGame(null); setOptions([]); setSearchTerms(""); setNote(""); };
  const liveDone = useRef(false);

  const showGame = (gm) => {
    setGame(gm);
    linkAny(gm, code || gm._code);
    setStage("found");
  };

  const lookup = async (raw) => {
    const c = (raw || "").replace(/\D/g, "");
    if (c.length < 8) { setErr("That doesn't look like a full barcode number."); setStage("idle"); return; }
    setCode(c); setErr("");
    if (games.find((g) => sameCode(g.upc, c)) || wishes.find((g) => sameCode(g.upc, c))) { setStage("local"); return; }
    setStage("looking");
    try {
      const data = await gameUpc(c);
      const list = (data.bgg_info || []).map(upcGame).filter((x) => x.name);
      if (data.bgg_info_status === "verified" && list.length) {
        const gm = { ...list[0], _code: c };
        setGame(gm);
        linkAny(gm, c);
        setStage("found");
      } else if (list.length) {
        setOptions(list.slice(0, 6));
        setSearchTerms(data.searched_for || "");
        setStage("choose");
      } else {
        setSearchTerms(data.searched_for || "");
        setNote(`The barcode database doesn't know ${c} yet. Search by name below, or type the name yourself.`);
        setStage("choose");
      }
    } catch (e) {
      setNote(`Couldn't reach the barcode database (${e.message}), so name it yourself.`);
      setStage("manual");
    }
  };

  const research = async () => {
    if (!searchTerms.trim()) return;
    setStage("looking");
    try {
      const data = await gameUpc(code, searchTerms.trim());
      const list = (data.bgg_info || []).map(upcGame).filter((x) => x.name);
      setOptions(list.slice(0, 6));
      setNote(list.length ? "" : `Nothing found for "${searchTerms}". Try different words.`);
    } catch (e) {
      setNote("Search didn't go through. Try again, or name it yourself.");
    }
    setStage("choose");
  };

  const choose = (gm) => { confirmUpc(gm); showGame(gm); };

  const onPhoto = async (file) => {
    setStage("reading"); setErr("");
    try { await lookup(await decodeBarcode(file)); }
    catch (e) {
      setErr("Couldn't read a barcode in that photo. Get close so the barcode fills most of the frame, keep it flat, and avoid glare. Or type the numbers under the bars below.");
      setStage("idle");
    }
  };

  // Live camera: reads the middle of each frame until a valid barcode shows up
  const videoRef = useRef(null);
  useEffect(() => {
    if (stage !== "live") return;
    let stream = null;
    let stopped = false;
    let timer = null;
    liveDone.current = false;
    (async () => {
      let det = null;
      try { det = await getDetector(); } catch (e) { det = null; }
      if (stopped) return;
      if (!det) { setErr("The scanner engine couldn't load. Check your connection, or take a photo instead."); setStage("idle"); return; }
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } },
        });
      } catch (e) {
        if (!stopped) { setErr("The camera couldn't start. Allow camera access for this site when asked (or in Settings, Apps, Safari, Camera), or take a photo instead."); setStage("idle"); }
        return;
      }
      if (stopped) { stream.getTracks().forEach((t) => t.stop()); return; }
      const v = videoRef.current;
      v.srcObject = stream;
      try { await v.play(); } catch (e) { /* autoplay is allowed for muted inline video */ }
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      let n = 0;
      const tick = async () => {
        if (stopped || liveDone.current) return;
        try {
          if (v.videoWidth) {
            n++;
            // Mostly scan the middle band (faster, fewer misreads); every 4th frame check the whole view
            const full = n % 4 === 0;
            const cw = full ? v.videoWidth : Math.round(v.videoWidth * 0.9);
            const ch = full ? v.videoHeight : Math.round(v.videoHeight * 0.5);
            canvas.width = cw; canvas.height = ch;
            ctx.drawImage(v, (v.videoWidth - cw) / 2, (v.videoHeight - ch) / 2, cw, ch, 0, 0, cw, ch);
            const r = await det.detect(canvas);
            const hit = r.map((x) => x.rawValue).find(okCode);
            if (hit && !liveDone.current) {
              liveDone.current = true;
              if (navigator.vibrate) navigator.vibrate(60);
              stream.getTracks().forEach((t) => t.stop());
              lookup(hit);
              return;
            }
          }
        } catch (e) { /* keep trying */ }
        timer = setTimeout(tick, 100);
      };
      tick();
    })();
    return () => {
      stopped = true;
      clearTimeout(timer);
      if (stream) stream.getTracks().forEach((t) => t.stop());
    };
  }, [stage]);

  const local = code ? games.find((g) => sameCode(g.upc, code)) : null;
  const localWish = code && !local ? wishes.find((g) => sameCode(g.upc, code)) : null;
  const mine = stage === "found" ? ownedMatch(game) : null;
  const wished = stage === "found" && !mine ? wishMatch(game) : null;
  const nameMatch = name.trim() ? games.find((g) => norm(g.name) === norm(name)) : null;
  const ageSelect = (
    <label className="f">When did you get it?
      <select value={age} onChange={(e) => setAge(e.target.value)}>
        {AGE_OPTIONS.map(([v, l]) => <option key={v} value={v}>{l}</option>)}
      </select>
    </label>
  );
  const onShelf = (g) => (
    <>
      <p style={{ margin: 0 }}>Already on your shelf.</p>
      <div className="bar" style={{ margin: 0, flexWrap: "wrap" }}>
        <button className="btn felt" onClick={() => { logPlay(g); onClose(); }}>Log a play</button>
        <button className="btn ghost" onClick={() => onOpen(g.id)}>Open it</button>
        {g.bgg?.id && <a className="btn ghost" href={bggUrl(g.bgg, g.name)} target="_blank" rel="noreferrer">View on BGG</a>}
      </div>
    </>
  );
  const onWish = (g) => (
    <>
      <p style={{ margin: 0 }}>On your wish list: {wishLine(g).replace("MSRP", "msrp").toLowerCase().replace("msrp", "MSRP")}.</p>
      {g.note && <p className="hint" style={{ margin: 0 }}>{g.note}</p>}
      <label className="f">Price on the shelf
        <input inputMode="decimal" placeholder="$" value={storePrice} onChange={(e) => setStorePrice(e.target.value.replace(/[^0-9.]/g, ""))} />
      </label>
      {Number(storePrice) > 0 && (g.msrp || g.maxPrice) ? (
        <p style={{ margin: 0, fontWeight: 700, color: g.maxPrice && Number(storePrice) > g.maxPrice ? "var(--tag)" : "var(--felt)" }}>
          {priceVerdict(g, Number(storePrice))}
        </p>
      ) : Number(storePrice) > 0 ? <p className="hint" style={{ margin: 0 }}>Add an MSRP or a price limit to this game to compare.</p> : null}
      <div className="bar" style={{ margin: 0, flexWrap: "wrap" }}>
        <button className="btn felt" onClick={() => { onBought(g); onClose(); }}>We bought it</button>
        <button className="btn ghost" onClick={() => onOpen(g.id)}>Open it</button>
        {g.bgg?.id && <a className="btn ghost" href={bggUrl(g.bgg, g.name)} target="_blank" rel="noreferrer">View on BGG</a>}
      </div>
    </>
  );
  const again = <button className="x" style={{ justifySelf: "start", padding: 0, color: "var(--ink)" }} onClick={reset}>Scan another</button>;

  return (
    <div className="sheet">
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <b style={{ fontSize: 17 }}>Scan a barcode</b>
        <button className="x" onClick={onClose}>Close</button>
      </div>

      {stage === "idle" && (
        <>
          <button className="btn felt" style={{ padding: 14 }} onClick={() => { setErr(""); setStage("live"); }}>Scan with camera</button>
          <label className="btn ghost filebtn">
            Take a photo instead
            <input type="file" accept="image/*" capture="environment" hidden onChange={(e) => { const f = e.target.files[0]; e.target.value = ""; f && onPhoto(f); }} />
          </label>
          <div className="bar" style={{ margin: 0 }}>
            <input inputMode="numeric" placeholder="Or type the barcode numbers" value={manual} onChange={(e) => setManual(e.target.value)} onKeyDown={(e) => e.key === "Enter" && lookup(manual)} aria-label="Barcode number" />
            <button className="btn ghost" onClick={() => lookup(manual)}>Go</button>
          </div>
          {err && <p style={{ margin: 0, color: "var(--tag)", fontSize: 14 }}>{err}</p>}
        </>
      )}

      {stage === "live" && (
        <>
          <div style={{ position: "relative", width: "100%", borderRadius: 8, overflow: "hidden", background: "#000" }}>
            <video ref={videoRef} playsInline muted autoPlay style={{ width: "100%", height: 320, objectFit: "cover", display: "block" }} />
            <div aria-hidden="true" style={{ position: "absolute", left: "6%", right: "6%", top: "32%", bottom: "32%", border: "3px solid var(--meeple)", borderRadius: 8, boxShadow: "0 0 0 999px rgba(0,0,0,.25)" }} />
          </div>
          <p className="hint" style={{ margin: 0 }}>Fit the barcode inside the box, about 5 to 8 inches away, and hold steady. It scans on its own.</p>
          <button className="btn ghost" onClick={() => setStage("idle")}>Cancel</button>
        </>
      )}

      {stage === "reading" && <p style={{ margin: 0 }} role="status">Reading the barcode…</p>}
      {stage === "looking" && <p style={{ margin: 0 }} role="status">Looking up {code}…</p>}

      {stage === "local" && (local || localWish) && (
        <>
          <div className="pick"><b>{(local || localWish).name}</b></div>
          {local ? onShelf(local) : onWish(localWish)}
          {again}
        </>
      )}

      {stage === "found" && game && (
        <>
          <div className="pick">
            {game.image && <img src={game.image} alt="" style={{ width: 48, height: 48, objectFit: "contain" }} onError={(e) => (e.target.style.display = "none")} />}
            <span><b>{game.name}</b>{game.year ? ` (${game.year})` : ""}</span>
          </div>
          {mine ? onShelf(mine) : wished ? onWish(wished) : (
            <>
              {ageSelect}
              <div className="bar" style={{ margin: 0, flexWrap: "wrap" }}>
                <button className="btn" onClick={() => onAdd(game, code, Number(age))}>Add to shelf</button>
                <button className="btn ghost" onClick={() => onAddWish(game, code)}>Add to wish list</button>
                {game.bggId && <a className="btn ghost" href={bggUrl({ id: game.bggId }, game.name)} target="_blank" rel="noreferrer">View on BGG</a>}
              </div>
            </>
          )}
          <button className="x" style={{ justifySelf: "start", padding: 0 }} onClick={() => { setName(""); setStage("manual"); }}>Wrong game?</button>
          {again}
        </>
      )}

      {stage === "choose" && (
        <>
          <p style={{ margin: 0 }}>{note || "Which game is this? Your pick also helps confirm it in the shared barcode database."}</p>
          {options.map((o, i) => (
            <button key={i} className="pick" style={{ textAlign: "left", cursor: "pointer", color: "var(--ink)" }} onClick={() => choose(o)}>
              {o.image && <img src={o.image} alt="" style={{ width: 44, height: 44, objectFit: "contain" }} onError={(e) => (e.target.style.display = "none")} />}
              <span><b>{o.name}</b>{o.year ? ` (${o.year})` : ""}</span>
            </button>
          ))}
          <div className="bar" style={{ margin: 0 }}>
            <input placeholder="Search by name" value={searchTerms} onChange={(e) => setSearchTerms(e.target.value)} onKeyDown={(e) => e.key === "Enter" && research()} aria-label="Search by name" />
            <button className="btn ghost" onClick={research}>Search</button>
          </div>
          <button className="x" style={{ justifySelf: "start", padding: 0 }} onClick={() => setStage("manual")}>Just type the name myself</button>
          {again}
        </>
      )}

      {stage === "manual" && (
        <>
          <p style={{ margin: 0 }}>{note || `Name barcode ${code} once and future scans of this box will find it instantly.`}</p>
          <a className="btn ghost" href={webSearch(`${code} board game`)} target="_blank" rel="noreferrer">Look up this barcode on the web</a>
          <label className="f">Game name
            <input list="owned-names" value={name} onChange={(e) => setName(e.target.value)} placeholder="Type or pick from your shelf" />
            <datalist id="owned-names">{games.map((g) => <option key={g.id} value={g.name} />)}</datalist>
          </label>
          {!nameMatch && ageSelect}
          <button className="btn" disabled={!name.trim()} onClick={() => onAdd({ name: name.trim() }, code, Number(age))}>
            {nameMatch ? `Link barcode to ${nameMatch.name}` : "Add to shelf"}
          </button>
          {!nameMatch && <button className="btn ghost" disabled={!name.trim()} onClick={() => onAddWish({ name: name.trim() }, code)}>Add to wish list</button>}
          {again}
        </>
      )}
    </div>
  );
}

function Detail({ g, upd, logPlay, remove, artApi, checkTitle, checking, onBought, openSelling, locations = [], priceCheck, pricing }) {
  const isWish = g.status === "wish";
  const linked = !!g.bgg?.id;
  const [pastDate, setPastDate] = useState(today());
  const [soldFor, setSoldFor] = useState("");
  const [bggLink, setBggLink] = useState("");
  const [imgLink, setImgLink] = useState("");
  const [bggQuery, setBggQuery] = useState(g.name);
  const [copied, setCopied] = useState("");
  const plays = [...g.plays].sort((a, b) => b.date.localeCompare(a.date));
  const { hasArt, broken, setPhoto, setArtUrl, clearArt } = artApi;
  const p = g.prices || {};
  const setPrice = (k, v) => upd(g.id, (x) => ({ ...x, prices: { ...(x.prices || {}), [k]: v === "" ? null : Number(v), manual: k !== "ebay" ? true : !!(x.prices || {}).manual } }));
  const fresh = g.market?.at && Date.now() - g.market.at < 3600000;
  const sugg = p.ebay ? suggestFrom(p.ebay) : null;
  const base = basePrice(g);
  const est = base ? estimateFrom(base, g.condition) : null;
  const money = (v) => v.replace(/[^0-9.]/g, "");

  // ---- pieces ----
  const bggButtons = (
    <>
      <div className="bar" style={{ margin: 0, flexWrap: "wrap" }}>
        <a className="btn ghost" href={bggUrl(g.bgg || {}, g.name)} target="_blank" rel="noreferrer">Open on BGG</a>
        <button className="btn ghost" onClick={async () => {
          const link = bggUrl(g.bgg, g.name);
          try { await navigator.clipboard.writeText(link); setCopied("yes"); } catch (e) { setCopied(link); }
          setTimeout(() => setCopied(""), 2500);
        }}>{copied === "yes" ? "Copied!" : "Copy link"}</button>
      </div>
      {copied && copied !== "yes" && <input readOnly value={copied} onFocus={(e) => e.target.select()} aria-label="BGG link" />}
    </>
  );

  const identify = (
    <div>
      <label className="f">Match to BoardGameGeek</label>
      {g.review ? <p className="hint">A title match is waiting for you at the top of the list.</p>
        : g.bggNone ? <p className="hint">The title database didn't find this one. Fix the title under Edit details and check again, or search for it below.</p>
        : null}
      <button className="btn ghost" style={{ margin: "6px 0 10px" }} disabled={checking} onClick={() => checkTitle([g])}>{checking ? "Checking…" : "Check title"}</button>
      <label className="f">Or search for
        <input value={bggQuery} onChange={(e) => setBggQuery(e.target.value)} autoCorrect="off" />
      </label>
      <div className="bar" style={{ margin: "8px 0 0", flexWrap: "wrap" }}>
        <a className="btn ghost" href={bggSearch(bggQuery.trim() || fullName(g))} target="_blank" rel="noreferrer">Search BGG</a>
        <a className="btn ghost" href={bggViaGoogle(bggQuery.trim() || g.name)} target="_blank" rel="noreferrer">Search with Google</a>
      </div>
      <div className="bar" style={{ margin: "8px 0 0" }}>
        <input placeholder="Paste BGG page link" value={bggLink} onChange={(e) => setBggLink(e.target.value.trim())} aria-label="BGG page link" />
        <button className="btn ghost" disabled={!parseBgg(bggLink)} onClick={() => { upd(g.id, (x) => ({ ...x, bgg: parseBgg(bggLink), bggNone: false, review: undefined })); setBggLink(""); }}>Save</button>
      </div>
      {bggLink && !parseBgg(bggLink) && <p className="hint" style={{ color: "var(--tag)" }}>That doesn't look like a BGG game page link.</p>}
    </div>
  );

  const titleEdition = (
    <div className="two">
      <label className="f">Title
        <input value={g.name} onChange={(e) => upd(g.id, (x) => ({ ...x, name: e.target.value }))} />
      </label>
      <label className="f">Edition
        <input list="edition-list" value={g.edition || ""} placeholder="Optional" onChange={(e) => upd(g.id, (x) => ({ ...x, edition: e.target.value }))} />
        <datalist id="edition-list">{EDITIONS.map((v) => <option key={v} value={v} />)}</datalist>
      </label>
    </div>
  );

  const unlinkRow = linked && (
    <div>
      <button className="x" style={{ padding: 0 }} onClick={() => upd(g.id, (x) => ({ ...x, bgg: undefined, bggNone: true }))}>Unlink from BGG</button>
      <p className="hint" style={{ marginBottom: 0 }}>Own a different edition with its own BGG page? Unlink, then search for it and paste that page's link.</p>
    </div>
  );

  const artSection = (
    <details className="more">
      <summary>Box art <small>{hasArt ? (broken ? "(link not loading)" : "(set)") : "(none yet)"}</small></summary>
      <div className="bar" style={{ margin: "6px 0 0", flexWrap: "wrap" }}>
        <label className="btn ghost filebtn">
          {hasArt ? "Replace with photo" : "Take a photo"}
          <input type="file" accept="image/*" hidden onChange={(e) => { const f = e.target.files[0]; e.target.value = ""; f && setPhoto(g, f); }} />
        </label>
        {hasArt && <button className="x" onClick={() => clearArt(g.id)}>Remove art</button>}
      </div>
      {broken && <p className="hint" style={{ color: "var(--tag)" }}>That image link won't load. Try a photo or a different link.</p>}
      <div className="bar" style={{ margin: "8px 0 0" }}>
        <input placeholder="Or paste an image link" value={imgLink} onChange={(e) => setImgLink(e.target.value.trim())} aria-label="Image link" />
        <button className="btn ghost" disabled={!/^https:\/\//.test(imgLink)} onClick={() => { setArtUrl(g.id, imgLink); setImgLink(""); }}>Save</button>
      </div>
      <p className="hint" style={{ marginBottom: 0 }}>On the BGG page, long-press the box image, choose Open in New Tab, then copy that tab's address.</p>
    </details>
  );

  const logRow = (
    <div>
      <label className="f">Log a play</label>
      <div className="bar" style={{ margin: "4px 0 0" }}>
        <input type="date" value={pastDate} max={today()} onChange={(e) => setPastDate(e.target.value)} aria-label="Play date" />
        <button className="btn felt" onClick={() => pastDate && logPlay(g, pastDate)}>Log play</button>
      </div>
      <p className="hint" style={{ marginBottom: 0 }}>{g.plays.length} play{g.plays.length === 1 ? "" : "s"} logged</p>
    </div>
  );

  const playHistory = plays.length > 0 && (
    <div>
      <label className="f">Play history</label>
      <ul className="plays" style={{ marginTop: 4 }}>
        {plays.slice(0, 8).map((pl) => (
          <li key={pl.id}>
            {new Date(pl.date + "T12:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })}
            <button className="x" onClick={() => upd(g.id, (x) => ({ ...x, plays: x.plays.filter((q) => q.id !== pl.id), deletedPlays: [...(x.deletedPlays || []), pl.id] }))}>Remove</button>
          </li>
        ))}
        {plays.length > 8 && <li style={{ color: "var(--muted)" }}>and {plays.length - 8} earlier plays</li>}
      </ul>
    </div>
  );

  const ownedFields = (
    <>
      <label className="f">Location
        <input list="loc-list" value={g.location || ""} placeholder="Where it lives, e.g. Basement shelf" onChange={(e) => upd(g.id, (x) => ({ ...x, location: e.target.value }))} />
        <datalist id="loc-list">{locations.map((l) => <option key={l} value={l} />)}</datalist>
      </label>
      <div className="two">
        <label className="f">Condition
          <select value={g.condition} onChange={(e) => { const c = e.target.value; upd(g.id, (x) => { const n = { ...x, condition: c }; return (x.prices || {}).manual || isWish ? n : { ...n, prices: autoPrices(n) }; }); }}>
            {CONDITIONS.map((c) => <option key={c}>{c}</option>)}
          </select>
        </label>
        <label className="f">Owned since
          <input type="date" value={g.ownedSince} onChange={(e) => e.target.value && upd(g.id, (x) => ({ ...x, ownedSince: e.target.value }))} />
        </label>
      </div>
    </>
  );

  const keeperBox = (
    <div className="bar" style={{ margin: 0, flexWrap: "wrap", justifyContent: "space-between" }}>
      <label className="check">
        <input type="checkbox" checked={!!g.keep} onChange={(e) => upd(g.id, (x) => ({ ...x, keep: e.target.checked, forSale: e.target.checked ? false : x.forSale }))} />
        Keeper
      </label>
      <button className={`btn ${g.forSale ? "ghost" : "tag"}`} onClick={() => upd(g.id, (x) => ({ ...x, forSale: !x.forSale, keep: x.forSale ? x.keep : false }))}>
        {g.forSale ? "Take off sale" : "Mark for sale"}
      </button>
    </div>
  );

  const sellingBody = (
    <div style={{ display: "grid", gap: 16 }}>
      {marketBox}
      {estimateBox}
      <div>
        <div className="bar" style={{ margin: "0 0 10px", flexWrap: "wrap" }}>
          <a className="btn ghost" href={ebaySold(fullName(g))} target="_blank" rel="noreferrer">eBay sold prices</a>
          <a className="btn ghost" href={fbSearch(fullName(g))} target="_blank" rel="noreferrer">Marketplace listings</a>
        </div>
        <div className="three">
          <label className="f">eBay sold
            <input inputMode="decimal" placeholder="$" value={p.ebay ?? ""} onChange={(e) => setPrice("ebay", money(e.target.value))} />
          </label>
          <label className="f">Garage sale
            <input inputMode="decimal" placeholder="$" value={p.garage ?? ""} onChange={(e) => setPrice("garage", money(e.target.value))} />
          </label>
          <label className="f">Marketplace
            <input inputMode="decimal" placeholder="$" value={p.marketplace ?? ""} onChange={(e) => setPrice("marketplace", money(e.target.value))} />
          </label>
        </div>
        {sugg && (sugg.garage !== p.garage || sugg.marketplace !== p.marketplace) && (
          <button className="btn ghost" style={{ marginTop: 8 }} onClick={() => upd(g.id, (x) => ({ ...x, prices: { ...x.prices, ...sugg, manual: true } }))}>
            Estimate from eBay: ${sugg.garage} garage, ${sugg.marketplace} Marketplace
          </button>
        )}
        <p className="hint" style={{ marginBottom: 0 }}>Enter a typical recent eBay sale. The fill-in button uses a rule of thumb: about 40% of eBay for a garage sale and 65% for Marketplace. Adjust to taste.</p>
      </div>
      <div>
        <label className="f">Sold it? Record the price</label>
        <div className="bar" style={{ margin: "4px 0 0" }}>
          <input inputMode="decimal" placeholder="$" value={soldFor} onChange={(e) => setSoldFor(money(e.target.value))} />
          <button className="btn tag" onClick={() => upd(g.id, (x) => ({ ...x, status: "sold", soldFor: Number(soldFor) || 0, soldOn: today() }))}>Mark sold</button>
        </div>
      </div>
    </div>
  );

  const wishFields = (
    <>
      {marketBox}
      <div className="two">
        <label className="f">Priority
          <select value={g.priority || "Want"} onChange={(e) => upd(g.id, (x) => ({ ...x, priority: e.target.value }))}>
            {PRIORITIES.map((v) => <option key={v}>{v}</option>)}
          </select>
        </label>
        <label className="f">Would pay up to
          <input inputMode="decimal" placeholder="$" value={g.maxPrice ?? ""} onChange={(e) => { const v = money(e.target.value); upd(g.id, (x) => ({ ...x, maxPrice: v === "" ? null : Number(v) })); }} />
        </label>
      </div>
      <div>
        <label className="f">MSRP
          <div className="bar" style={{ margin: 0 }}>
            <input inputMode="decimal" placeholder="$" value={g.msrp ?? ""} onChange={(e) => { const v = money(e.target.value); upd(g.id, (x) => ({ ...x, msrp: v === "" ? null : Number(v) })); }} />
            <a className="btn ghost" href={msrpSearch(fullName(g))} target="_blank" rel="noreferrer">Look up MSRP</a>
          </div>
        </label>
        {g.msrp && g.maxPrice ? <p className="hint" style={{ marginBottom: 0 }}>Your limit is {Math.round((1 - g.maxPrice / g.msrp) * 100)}% off MSRP.</p> : null}
      </div>
      <label className="f">Notes
        <input value={g.note || ""} placeholder="Who wants it, why, where you saw it" onChange={(e) => upd(g.id, (x) => ({ ...x, note: e.target.value }))} />
      </label>
      <div className="bar" style={{ margin: 0, flexWrap: "wrap" }}>
        <a className="btn ghost" href={shopSearch(fullName(g))} target="_blank" rel="noreferrer">Compare new prices</a>
        <a className="btn ghost" href={ebaySold(fullName(g))} target="_blank" rel="noreferrer">eBay sold (used)</a>
      </div>
      <button className="btn felt" style={{ justifySelf: "start" }} onClick={() => onBought(g)}>We bought it, move to shelf</button>
    </>
  );

  const marketBox = (
    <div>
      <label className="f">{isWish ? "Current new price" : "New price when added"}</label>
      {g.market?.low ? (
        <p style={{ margin: "4px 0 0" }}><b>${g.market.low}</b> <span style={{ color: "var(--muted)", fontSize: 13.5 }}>lowest of {g.market.offers} offer{g.market.offers === 1 ? "" : "s"}{g.market.inStock ? "" : " (none in stock)"}, {new Date(g.market.at).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" })}</span></p>
      ) : g.market?.none ? (
        <p className="hint">No offers found for this game. Enter an MSRP below to estimate from that.</p>
      ) : g.bgg?.id ? (
        <p className="hint">{pricing ? "Checking…" : "Not checked yet."}</p>
      ) : (
        <p className="hint">Link this game to BGG and its new price is captured automatically.</p>
      )}
      {g.bgg?.id && (
        <div className="bar" style={{ margin: "6px 0 0", flexWrap: "wrap" }}>
          <button className="btn ghost" disabled={pricing || fresh} onClick={() => priceCheck([g], true)}>{pricing ? "Checking…" : fresh ? "Checked recently" : "Update price"}</button>
          {g.market?.url && <a className="btn ghost" href={g.market.url} target="_blank" rel="noreferrer">See offers</a>}
        </div>
      )}
      <p className="hint" style={{ marginBottom: 0 }}>From <a href={g.market?.url || "https://boardgameprices.com"} target="_blank" rel="noreferrer">BoardGamePrices.com</a>.{isWish ? "" : " Stored with the game; only changes if you tap Update price."}</p>
    </div>
  );

  const estimateBox = !isWish && (
    <div>
      <label className="f">MSRP (optional)
        <div className="bar" style={{ margin: 0 }}>
          <input inputMode="decimal" placeholder="$" value={g.msrp ?? ""} onChange={(e) => { const v = money(e.target.value); upd(g.id, (x) => { const n = { ...x, msrp: v === "" ? null : Number(v) }; return (x.prices || {}).manual ? n : { ...n, prices: autoPrices(n) }; }); }} />
          <a className="btn ghost" href={msrpSearch(fullName(g))} target="_blank" rel="noreferrer">Look up MSRP</a>
        </div>
      </label>
      {est ? (
        <p style={{ margin: "8px 0 0" }}>
          <b>Estimate for {g.condition.toLowerCase()} condition:</b> garage sale ${est.garage} ({Math.round(rateFor(g.condition).garage * 100)}%), Marketplace ${est.marketplace} ({Math.round(rateFor(g.condition).marketplace * 100)}%) of ${base} {g.msrp ? "MSRP" : "new price"}.
        </p>
      ) : (
        <p className="hint" style={{ marginBottom: 0 }}>Enter an MSRP, or link the game to BGG, to get an estimate.</p>
      )}
      {est && p.manual && (est.garage !== p.garage || est.marketplace !== p.marketplace) ? (
        <button className="btn ghost" style={{ marginTop: 8 }} onClick={() => upd(g.id, (x) => ({ ...x, prices: autoPrices(x) }))}>Use the estimate</button>
      ) : null}
      <p className="hint" style={{ marginBottom: 0 }}>Your prices below fill in from the estimate until you type your own. MSRP takes priority over the new price when both are set.</p>
    </div>
  );

  const deleteBtn = (
    <button className="x" style={{ justifySelf: "start", padding: 0 }} onClick={() => remove(g)}>{isWish ? "Remove from wish list" : "Delete game from shelf"}</button>
  );

  // ---- layout ----
  return (
    <div className="detail">
      {linked ? bggButtons : identify}

      {isWish ? wishFields : (
        <>
          {logRow}
          {keeperBox}
          {openSelling && (
            <div className="sellbox">
              <label className="f" style={{ marginBottom: 8 }}>Selling</label>
              {sellingBody}
            </div>
          )}
        </>
      )}

      <details className="more">
        <summary>Edit details <small>{isWish ? "(title, art)" : "(title, location, condition, art, plays)"}</small></summary>
        <div style={{ display: "grid", gap: 14 }}>
          {titleEdition}
          {!isWish && ownedFields}
          {artSection}
          {!isWish && playHistory}
          {!isWish && !openSelling && (
            <details className="more">
              <summary>Selling <small>{p.garage || p.marketplace ? `($${p.marketplace || p.garage} set)` : "(prices, mark sold)"}</small></summary>
              {sellingBody}
            </details>
          )}
          {unlinkRow}
          {deleteBtn}
        </div>
      </details>
    </div>
  );
}

function App() {
  const [data, setData] = useState({ games: [], dustMonths: 12 });
  const [art, setArt] = useState({});
  const [broken, setBroken] = useState({});
  const [loaded, setLoaded] = useState(false);
  const [tab, setTab] = useState("shelf");
  const [open, setOpen] = useState(null);
  const [adding, setAdding] = useState(false);
  const [scanning, setScanning] = useState(false);
  const [bulk, setBulk] = useState(false);
  const [form, setForm] = useState({ name: "", condition: "Good", ownedSince: today() });
  const [bulkText, setBulkText] = useState("");
  const [bulkAge, setBulkAge] = useState("1");
  const [fixAge, setFixAge] = useState("1");
  const [q, setQ] = useState("");
  const [sort, setSort] = useState("name");
  const [msg, setMsg] = useState("");
  const [toast, setToast] = useState("");
  const [copyText, setCopyText] = useState("");
  const [importText, setImportText] = useState("");
  const [justPlayed, setJustPlayed] = useState(null);
  const [checking, setChecking] = useState(false);
  const [wishName, setWishName] = useState("");
  const [wishPriority, setWishPriority] = useState("Want");
  const [wishText, setWishText] = useState("");
  const [locFilter, setLocFilter] = useState("");
  const [pricing, setPricing] = useState(false);
  const pricingRef = useRef(false);
  const priceTried = useRef(new Set());
  const [syncCfg, setSyncCfg] = useState(null);
  const [sync, setSync] = useState({ state: "off" });
  const [repoDraft, setRepoDraft] = useState("");
  const [tokenDraft, setTokenDraft] = useState("");
  const [codeDraft, setCodeDraft] = useState("");
  const [setupText, setSetupText] = useState("");
  const dataRef = useRef(data); dataRef.current = data;
  const artRef = useRef(art); artRef.current = art;
  const cfgRef = useRef(null);
  const lastSynced = useRef("");
  const busyRef = useRef(false);
  const againRef = useRef(false);
  const timerRef = useRef(null);

  useEffect(() => {
    (async () => {
      try {
        const r = await window.storage.get(KEY);
        if (r && r.value) { const d = JSON.parse(r.value); setData({ ...d, games: (d.games || []).map(normalize) }); }
      } catch (e) { /* first run */ }
      let loadedArt = {};
      try { const a = await window.storage.get(ART_KEY); if (a && a.value) { loadedArt = JSON.parse(a.value); setArt(loadedArt); } } catch (e) { /* no art yet */ }
      // Give existing art a timestamp so it can sync
      setData((d) => {
        const missing = Object.keys(loadedArt).filter((id) => !(d.artTimes || {})[id]);
        return missing.length ? { ...d, artTimes: { ...(d.artTimes || {}), ...Object.fromEntries(missing.map((id) => [id, 1])) } } : d;
      });
      try {
        const s = await window.storage.get(SYNC_KEY);
        if (s && s.value) { const cfg = JSON.parse(s.value); cfgRef.current = cfg; setSyncCfg(cfg); }
      } catch (e) { /* sync not set up */ }
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    window.storage.set(KEY, JSON.stringify(data)).catch(() => setMsg("Couldn't save your last change. Try again in a moment."));
    if (cfgRef.current && canon(data) !== lastSynced.current) schedule(lastSynced.current ? 3000 : 300);
  }, [data, loaded]);

  // Check for the other phone's changes when the app comes back into view, and every minute while open
  useEffect(() => {
    const onVis = () => { if (document.visibilityState === "visible" && cfgRef.current) schedule(200); };
    document.addEventListener("visibilitychange", onVis);
    const t = setInterval(() => { if (document.visibilityState === "visible" && cfgRef.current) schedule(0); }, 60000);
    return () => { document.removeEventListener("visibilitychange", onVis); clearInterval(t); };
  }, []);

  useEffect(() => {
    if (!loaded) return;
    window.storage.set(ART_KEY, JSON.stringify(art)).catch(() => setMsg("Couldn't save box art. Try again in a moment."));
  }, [art, loaded]);

  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(""), 2400); return () => clearTimeout(t); }, [toast]);

  const upd = (id, fn) => setData((d) => ({ ...d, games: d.games.map((g) => (g.id === id ? { ...fn(g), updatedAt: Date.now() } : g)) }));
  const logPlay = (g, date = today()) => {
    upd(g.id, (x) => ({ ...x, plays: [...x.plays, { id: uid(), date }] }));
    setToast(`Logged a play of ${g.name}`);
    setJustPlayed(g.id);
    setTimeout(() => setJustPlayed(null), 1500);
  };
  const putArt = (id, value, onlyIfEmpty = false) => {
    if (onlyIfEmpty && artRef.current[id]) return;
    setArt((a) => { const n = { ...a }; if (value) n[id] = value; else delete n[id]; return n; });
    setData((d) => ({ ...d, artTimes: { ...(d.artTimes || {}), [id]: Date.now() } }));
  };
  const clearArt = (id) => putArt(id, null);
  const remove = (g) => { setData((d) => ({ ...d, games: d.games.filter((x) => x.id !== g.id), deleted: { ...(d.deleted || {}), [g.id]: Date.now() } })); clearArt(g.id); setOpen(null); setToast(`Removed ${g.name}`); };
  const setPhoto = async (g, file) => {
    try { const d = await shrink(file); putArt(g.id, d); setBroken((b) => ({ ...b, [g.id]: false })); setToast("Box photo saved"); }
    catch (e) { setMsg("That photo couldn't be read. Try a JPG or PNG."); }
  };
  const setArtUrl = (id, url) => { putArt(id, url); setBroken((b) => ({ ...b, [id]: false })); setToast("Box art saved"); };
  const backdate = (ids, years) => {
    const date = yearsAgo(years);
    setData((d) => ({ ...d, games: d.games.map((g) => (ids.includes(g.id) ? { ...g, ownedSince: date, updatedAt: Date.now() } : g)) }));
    setToast(`Updated ${ids.length} game${ids.length === 1 ? "" : "s"}`);
  };
  // ---------- Sync ----------
  const schedule = (ms) => {
    clearTimeout(timerRef.current);
    timerRef.current = setTimeout(() => runSync(), ms);
  };
  const runSync = async (attempt = 0) => {
    const cfg = cfgRef.current;
    if (!cfg) return;
    if (busyRef.current) { againRef.current = true; return; }
    busyRef.current = true;
    setSync((s) => ({ ...s, state: "syncing" }));
    try {
      const remote = await ghGet(cfg, "shelf.json");
      const local = dataRef.current;
      const merged = mergeShelves(local, remote ? remote.json : null);

      // Box art lives in its own file and only moves when something changed
      const localTimes = local.artTimes || {};
      const remoteTimes = (remote && remote.json.artTimes) || {};
      const ids = [...new Set([...Object.keys(localTimes), ...Object.keys(remoteTimes)])];
      const pullIds = ids.filter((id) => (remoteTimes[id] || 0) > (localTimes[id] || 0));
      const pushIds = ids.filter((id) => (localTimes[id] || 0) > (remoteTimes[id] || 0));
      if (pullIds.length || pushIds.length) {
        const ra = await ghGet(cfg, "art.json");
        const images = { ...((ra && ra.json.images) || {}) };
        if (pullIds.length) {
          setArt((a) => {
            const n = { ...a };
            pullIds.forEach((id) => { if (images[id]) n[id] = images[id]; else delete n[id]; });
            return n;
          });
        }
        if (pushIds.length) {
          const cur = artRef.current;
          pushIds.forEach((id) => { if (cur[id]) images[id] = cur[id]; else delete images[id]; });
          await ghPut(cfg, "art.json", { images }, ra && ra.sha);
        }
      }

      const mergedCanon = canon(merged);
      if (!remote || mergedCanon !== canon(remote.json)) await ghPut(cfg, "shelf.json", merged, remote && remote.sha);
      lastSynced.current = mergedCanon;
      setData((cur) => mergeShelves(cur, merged));
      setSync({ state: "ok", at: Date.now() });
    } catch (e) {
      // Someone else saved at the same moment: pull their version and try again
      if ((e.status === 409 || e.status === 422) && attempt < 2) {
        busyRef.current = false;
        return runSync(attempt + 1);
      }
      setSync({ state: "error", error: syncError(e) });
    }
    busyRef.current = false;
    if (againRef.current) { againRef.current = false; schedule(500); }
  };
  const connectSync = async (cfg) => {
    const clean = { repo: cfg.repo.trim().replace(/^https?:\/\/github\.com\//i, "").replace(/\/+$/, ""), token: cfg.token.trim() };
    setSync({ state: "syncing" });
    try {
      const r = await fetch(`https://api.github.com/repos/${clean.repo}`, { headers: ghHeaders(clean), cache: "no-store" });
      if (!r.ok) throw ghErr(r);
      const info = await r.json();
      if (!info.private) setMsg("Heads up: that repo is public, so anyone could see your shelf data. Make it private in the repo's Settings.");
      await window.storage.set(SYNC_KEY, JSON.stringify(clean));
      cfgRef.current = clean;
      lastSynced.current = "";
      setSyncCfg(clean);
      setRepoDraft(""); setTokenDraft(""); setCodeDraft("");
      setToast("Connected. Syncing your shelf…");
      runSync();
    } catch (e) {
      setSync({ state: "error", error: syncError(e) });
    }
  };
  const disconnectSync = async () => {
    try { await window.storage.delete(SYNC_KEY); } catch (e) { /* ignore */ }
    cfgRef.current = null;
    setSyncCfg(null);
    setSync({ state: "off" });
    setSetupText("");
    setToast("Sync turned off on this phone");
  };
  const copySetup = async () => {
    const code = makeSetupCode(syncCfg);
    try { await navigator.clipboard.writeText(code); setToast("Setup code copied"); setSetupText(""); }
    catch (e) { setSetupText(code); }
  };
  const syncLine =
    !syncCfg ? null
    : sync.state === "syncing" ? "Shared shelf: syncing…"
    : sync.state === "error" ? "Shared shelf: sync problem, see Shared shelf below."
    : sync.at ? `Shared shelf: synced ${sinceLabel(sync.at)}.`
    : "Shared shelf: connected.";

  // ---------- Price checks (BoardGamePrices.com) ----------
  const priceCheck = async (list, force = false) => {
    const games = list.filter((g) => g.bgg?.id && (force ? !(g.market?.at && Date.now() - g.market.at < 3600000) : !g.market));
    games.forEach((g) => priceTried.current.add(g.id));
    if (!games.length || pricingRef.current) return;
    pricingRef.current = true;
    setPricing(true);
    try {
      const ids = [...new Set(games.map((g) => String(g.bgg.id)))];
      const results = {};
      for (let i = 0; i < ids.length; i += 20) Object.assign(results, await fetchBgp(ids.slice(i, i + 20)));
      const want = new Set(games.map((g) => g.id));
      setData((d) => ({
        ...d,
        games: d.games.map((g) => {
          if (!want.has(g.id)) return g;
          const m = results[String(g.bgg?.id)];
          if (!m) return g;
          const next = { ...g, market: m, updatedAt: Date.now() };
          if ((g.status || "owned") === "owned" && !(g.prices || {}).manual) next.prices = autoPrices(next);
          return next;
        }),
      }));
      if (force) setToast(games.length === 1 ? "Price updated" : `Prices updated for ${games.length} games`);
    } catch (e) {
      setMsg(`Couldn't check prices right now (${e.message}). Try Refresh price again later.`);
    }
    pricingRef.current = false;
    setPricing(false);
  };

  // New games linked to BGG get their price checked automatically
  useEffect(() => {
    if (!loaded) return;
    const todo = data.games.filter((g) => ["owned", "wish", undefined].includes(g.status) && g.bgg?.id && !g.market && !priceTried.current.has(g.id));
    if (!todo.length) return;
    const t = setTimeout(() => priceCheck(todo), 1500);
    return () => clearTimeout(t);
  }, [data, loaded]);

  // ---------- Title checks ----------
  const checkTitles = async (list) => {
    if (!list.length) return;
    setChecking(true);
    let auto = 0, toReview = 0, none = 0, failed = 0, lastErr = "";
    for (let i = 0; i < list.length; i++) {
      const g = list[i];
      if (list.length > 1) setMsg(`Checking titles… ${i + 1} of ${list.length}`);
      try {
        const results = await wikidataBgg(g.name);
        const exact = results.find((r) => norm(r.name) === norm(g.name));
        // If a different edition of the same game exists, ask instead of guessing
        const editionTwin = exact && results.some((r) => r !== exact && norm(r.name).startsWith(norm(g.name)) && /edition|revised|deluxe|anniversary|big box/i.test(r.name));
        if (exact && !editionTwin) {
          auto++;
          upd(g.id, (x) => confirmMatch(x, exact));
        } else if (results.length) {
          toReview++;
          const ordered = exact ? [exact, ...results.filter((r) => r !== exact)] : results;
          upd(g.id, (x) => ({ ...x, review: { match: ordered[0], alternatives: ordered.slice(1, 4) }, bggNone: false }));
        } else {
          none++;
          upd(g.id, (x) => ({ ...x, review: undefined, bggNone: true }));
        }
      } catch (e) { failed++; lastErr = e.message; }
    }
    setMsg(failed ? `Couldn't reach the title database for ${failed} game${failed === 1 ? "" : "s"}. Tap Check title to try again. (${lastErr})` : "");
    const parts = [auto && `${auto} confirmed`, toReview && `${toReview} to review`, none && `${none} not found`].filter(Boolean);
    if (parts.length) setToast(`Title check: ${parts.join(", ")}`);
    setChecking(false);
  };

  const openGame = (id, tabName) => {
    const st = dataRef.current.games.find((x) => x.id === id)?.status;
    setScanning(false); setTab(tabName || (st === "wish" ? "wish" : "shelf")); setQ(""); setOpen(id);
    setTimeout(() => document.getElementById(`g-${id}`)?.scrollIntoView({ behavior: "smooth", block: "center" }), 120);
  };

  const threshold = data.dustMonths * 30;
  const owned = data.games.filter((g) => (g.status || "owned") === "owned");
  const wishes = data.games.filter((g) => g.status === "wish")
    .sort((a, b) => PRIORITIES.indexOf(a.priority || "Want") - PRIORITIES.indexOf(b.priority || "Want") || a.name.localeCompare(b.name));
  const wishReviews = wishes.filter((g) => g.review);
  const locations = [...new Set(owned.map((g) => (g.location || "").trim()).filter(Boolean))].sort((a, b) => a.localeCompare(b));
  const sold = data.games.filter((g) => g.status === "sold");
  const forSale = owned.filter((g) => g.forSale).sort((a, b) => a.name.localeCompare(b.name));
  const dusty = owned.filter((g) => !g.keep && !g.forSale && idleDays(g) >= threshold).sort((a, b) => idleDays(b) - idleDays(a));
  const reviews = owned.filter((g) => g.review);
  const unchecked = owned.filter((g) => !g.bgg?.id && !g.review && !g.bggNone);
  const newbies = owned.filter((g) => !g.plays.length && daysSince(g.ownedSince) < 30);
  const shelf = useMemo(() => {
    const ql = q.toLowerCase();
    const f = owned.filter((g) =>
      (g.name.toLowerCase().includes(ql) || (g.location || "").toLowerCase().includes(ql)) &&
      (!locFilter || (g.location || "").trim() === locFilter));
    return sort === "name" ? f.sort((a, b) => a.name.localeCompare(b.name)) : f.sort((a, b) => idleDays(b) - idleDays(a));
  }, [data, q, sort, locFilter]);

  const linkScan = (id, code, info) => {
    upd(id, (x) => ({
      ...x,
      upc: code || x.upc,
      bgg: x.bgg?.id ? x.bgg : info?.bggId ? { id: info.bggId, slug: "" } : x.bgg,
    }));
    if (info?.image) putArt(id, info.image, true);
  };
  const addFromScan = (info, code, years) => {
    const match = owned.find((g) => (info.bggId && String(g.bgg?.id) === info.bggId) || norm(g.name) === norm(info.name));
    if (match) {
      linkScan(match.id, code, info);
      setToast(`Barcode linked to ${match.name}`);
      openGame(match.id);
      return;
    }
    const g = {
      id: uid(), name: info.name, condition: "Good", ownedSince: yearsAgo(years), plays: [], keep: false, status: "owned", upc: code, updatedAt: Date.now(), addedAt: today(),
      ...(info.bggId ? { bgg: { id: info.bggId, slug: "" } } : {}),
    };
    setData((d) => ({ ...d, games: [...d.games, g] }));
    if (info.image) putArt(g.id, info.image);
    setToast(`Added ${info.name}`);
    openGame(g.id);
    if (!info.bggId) checkTitles([g]);
  };

  // ---------- Wish list ----------
  const newWish = (name, extra = {}) => ({
    id: uid(), name, status: "wish", priority: wishPriority, condition: "Good", ownedSince: today(),
    plays: [], keep: false, updatedAt: Date.now(), ...extra,
  });
  const addWish = () => {
    const name = wishName.trim();
    if (!name) return;
    const dupe = [...owned, ...wishes].find((g) => norm(g.name) === norm(name));
    if (dupe) { setToast(dupe.status === "wish" ? `${dupe.name} is already on the wish list` : `You already own ${dupe.name}`); openGame(dupe.id); return; }
    const g = newWish(name);
    setData((d) => ({ ...d, games: [...d.games, g] }));
    setWishName("");
    setToast(`Added ${name} to the wish list. Checking title…`);
    checkTitles([g]);
  };
  const addWishFromScan = (info, code) => {
    const match = wishes.find((g) => (info.bggId && String(g.bgg?.id) === info.bggId) || norm(g.name) === norm(info.name));
    if (match) { linkScan(match.id, code, info); openGame(match.id, "wish"); return; }
    const g = newWish(info.name, { priority: "Want", upc: code, ...(info.bggId ? { bgg: { id: info.bggId, slug: "", year: info.year || null } } : {}) });
    setData((d) => ({ ...d, games: [...d.games, g] }));
    if (info.image) putArt(g.id, info.image);
    setToast(`Added ${info.name} to the wish list`);
    openGame(g.id, "wish");
    if (!info.bggId) checkTitles([g]);
  };
  const bought = (g) => {
    priceTried.current.delete(g.id);
    upd(g.id, (x) => ({ ...x, status: "owned", ownedSince: today(), boughtOn: today(), addedAt: today(), review: undefined, market: undefined }));
    setToast(`${g.name} moved to your shelf. Enjoy!`);
    openGame(g.id, "shelf");
  };
  const copyWishes = async () => {
    const text = "Our board game wish list\n\n" + PRIORITIES.map((p) => {
      const items = wishes.filter((g) => (g.priority || "Want") === p);
      return items.length ? `${p}:\n` + items.map((g) => `- ${g.name}${g.edition ? ` (${g.edition})` : ""}${g.msrp ? `, MSRP $${g.msrp}` : ""}${g.bgg?.id ? `  ${bggUrl(g.bgg, g.name, true)}` : ""}`).join("\n") : "";
    }).filter(Boolean).join("\n\n");
    try { await navigator.clipboard.writeText(text); setToast("Wish list copied"); setWishText(""); }
    catch (e) { setWishText(text); }
  };

  const addGames = () => {
    const names = bulk ? bulkText.split("\n").map((s) => s.trim()).filter(Boolean) : [form.name.trim()].filter(Boolean);
    if (!names.length) return;
    const fresh = names.map((name) => ({
      id: uid(), name, condition: bulk ? "Good" : form.condition,
      ownedSince: bulk ? yearsAgo(Number(bulkAge)) : form.ownedSince || today(),
      plays: [], keep: false, status: "owned", updatedAt: Date.now(), addedAt: today(),
    }));
    setData((d) => ({ ...d, games: [...d.games, ...fresh] }));
    setForm({ name: "", condition: "Good", ownedSince: today() });
    setBulkText("");
    setAdding(false);
    setToast(`Added ${names.length} game${names.length === 1 ? "" : "s"}. Checking titles…`);
    checkTitles(fresh);
  };

  const priced = forSale.filter((g) => g.prices && (g.prices.garage || g.prices.marketplace));
  const sum = (k) => priced.reduce((s, g) => s + (g.prices[k] || 0), 0);
  const soldTotal = sold.reduce((s, g) => s + (g.soldFor || 0), 0);

  const copyListing = async () => {
    const lines = priced.map((g) => `${g.name}${g.edition ? ` (${g.edition})` : ""}, ${g.condition.toLowerCase()}: $${g.prices.marketplace || g.prices.garage}`);
    const text = `Board games for sale. Pickup only, cash or Venmo. Message me with questions.\n\n${lines.join("\n")}`;
    try { await navigator.clipboard.writeText(text); setToast("Listing copied"); setCopyText(""); }
    catch (e) { setCopyText(text); }
  };

  const renderCard = (g, mode) => {
    const wish = mode === "wish";
    const sale = mode === true;
    // For sale: always gray. Otherwise stays in full color for a year after going on the shelf, then fades as it sits unplayed
    const level = wish ? 0 : g.forSale ? 1 : daysSince(g.addedAt || today()) < 365 ? 0 : Math.min(1, idleDays(g) / threshold);
    const isOpen = open === g.id;
    const showArt = art[g.id] && !broken[g.id];
    const p = g.prices || {};
    return (
      <div className="game" key={g.id} id={`g-${g.id}`}>
        <div className={`thumb ${showArt ? "" : "none"}`} style={{ "--dust-level": level }} aria-hidden="true">
          {showArt
            ? <img src={art[g.id]} alt="" onError={() => setBroken((b) => ({ ...b, [g.id]: true }))} />
            : <span>{g.name.charAt(0).toUpperCase()}</span>}
        </div>
        <div className="body">
          <div className="row">
            <button className="name" aria-expanded={isOpen} onClick={() => setOpen(isOpen ? null : g.id)}>
              <b>{g.name}{g.edition ? <small> ({g.edition})</small> : g.bgg?.year ? <small> ({g.bgg.year})</small> : null}</b>
              <span>{wish ? wishLine(g) : idleLabel(g)}{sale ? `, ${g.condition.toLowerCase()}` : ""}{!wish && g.location ? <span className="loc">{g.location}</span> : null}{!wish && !sale && g.forSale ? <span className="loc" style={{ borderColor: "var(--tag)", color: "var(--tag)" }}>For sale</span> : null}</span>
            </button>
            {wish ? (
              <button className="played" onClick={() => bought(g)}>Bought it</button>
            ) : (
              <button className={`played ${justPlayed === g.id ? "done" : ""}`} onClick={() => logPlay(g)}>
                {justPlayed === g.id ? "Logged" : "Played"}
              </button>
            )}
          </div>
          {sale && (p.garage || p.marketplace) ? (
            <div className="price">
              <div><small>Garage sale</small><strong>{p.garage ? `$${p.garage}` : "—"}</strong></div>
              <div><small>Marketplace</small><strong>{p.marketplace ? `$${p.marketplace}` : "—"}</strong></div>
            </div>
          ) : sale && !isOpen ? (
            <p className="note">No prices yet. Tap the name to check eBay and set them.</p>
          ) : null}
          {isOpen && <Detail g={g} upd={upd} logPlay={logPlay} remove={remove} artApi={{ hasArt: !!art[g.id], broken: !!broken[g.id], setPhoto, setArtUrl, clearArt }} checkTitle={checkTitles} checking={checking} onBought={bought} openSelling={sale} locations={locations} priceCheck={priceCheck} pricing={pricing} />}
        </div>
      </div>
    );
  };

  const scannerEl = (
    <Scanner games={owned} wishes={wishes} onClose={() => setScanning(false)} onAdd={addFromScan} onAddWish={addWishFromScan}
      onBought={bought} onOpen={openGame} logPlay={logPlay} onLink={linkScan} />
  );
  const renderReviews = (list) => (
    <>
            {list.length > 0 && (
              <>
                <h2>Confirm {list.length} title{list.length === 1 ? "" : "s"}</h2>
                <div className="list" style={{ marginBottom: 18 }}>
                  {list.map((g) => (
                    <div className="review" key={g.id}>
                      <p>You entered <b>{g.name}</b></p>
                      {[g.review.match, ...(g.review.alternatives || [])].filter(Boolean).map((m, i) => (
                        <button className="pick" key={i} onClick={() => { upd(g.id, (x) => confirmMatch(x, m)); setToast(`Confirmed ${m.name}. Set the edition if it matters.`); openGame(g.id); }}>
                          <span><b>{m.name}</b>{m.year ? ` (${m.year})` : ""}</span>
                          <em>{i === 0 ? "Best match" : "Also possible"}</em>
                        </button>
                      ))}
                      <button className="x" style={{ justifySelf: "start", padding: 0 }} onClick={() => upd(g.id, (x) => ({ ...x, review: undefined, bggNone: true }))}>None of these, keep my title</button>
                    </div>
                  ))}
                </div>
              </>
            )}
    </>
  );

  if (!loaded) return <div className="bg"><div className="app"><style>{css}</style><p className="sub">Loading your shelf… (version {APP_VERSION})</p></div></div>;

  return (
    <div className="bg">
      <div className="app">
        <style>{css}</style>
        <h1>Game shelf</h1>
        <p className="sub">
          {owned.length} game{owned.length === 1 ? "" : "s"} owned. {dusty.length} haven't been played in {data.dustMonths} months.{wishes.length ? ` ${wishes.length} on the wish list.` : ""}
          {syncLine && <><br /><button className="x" style={{ padding: 0, color: sync.state === "error" ? "var(--tag)" : "var(--muted)", fontWeight: 600, fontSize: 14 }} onClick={() => runSync()}>{syncLine}</button></>}
        </p>

        <div className="tabs" role="tablist">
          <button className="tab" role="tab" aria-selected={tab === "shelf"} onClick={() => { setTab("shelf"); setScanning(false); }}>Shelf</button>
          <button className="tab" role="tab" aria-selected={tab === "dust"} onClick={() => { setTab("dust"); setScanning(false); }}>Unplayed ({dusty.length})</button>
          <button className="tab" role="tab" aria-selected={tab === "sale"} onClick={() => { setTab("sale"); setScanning(false); }}>For sale ({forSale.length})</button>
          <button className="tab" role="tab" aria-selected={tab === "wish"} onClick={() => { setTab("wish"); setScanning(false); }}>Wish list ({wishes.length})</button>
        </div>

        {msg && <div className="msg" role="status">{msg} <button className="x" onClick={() => setMsg("")}>Dismiss</button></div>}

        {tab === "shelf" && (
          <>
            {renderReviews(reviews)}

            {adding ? (
              <div className="sheet">
                <div className="bar" style={{ margin: 0 }}>
                  <button className={`btn ${bulk ? "ghost" : ""}`} onClick={() => setBulk(false)}>One game</button>
                  <button className={`btn ${bulk ? "" : "ghost"}`} onClick={() => setBulk(true)}>Paste a list</button>
                </div>
                {bulk ? (
                  <>
                    <label className="f">One game per line
                      <textarea value={bulkText} onChange={(e) => setBulkText(e.target.value)} placeholder={"Catan\nTicket to Ride\nWingspan"} />
                    </label>
                    <label className="f">When did you get these?
                      <select value={bulkAge} onChange={(e) => setBulkAge(e.target.value)}>
                        {AGE_OPTIONS.map(([v, l]) => <option key={v} value={v}>{l}</option>)}
                      </select>
                    </label>
                  </>
                ) : (
                  <>
                    <label className="f">Name<input autoFocus value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} onKeyDown={(e) => e.key === "Enter" && addGames()} /></label>
                    <div className="two">
                      <label className="f">Condition
                        <select value={form.condition} onChange={(e) => setForm({ ...form, condition: e.target.value })}>
                          {CONDITIONS.map((c) => <option key={c}>{c}</option>)}
                        </select>
                      </label>
                      <label className="f">Owned since<input type="date" value={form.ownedSince} onChange={(e) => setForm({ ...form, ownedSince: e.target.value })} /></label>
                    </div>
                  </>
                )}
                <div className="bar" style={{ margin: 0 }}>
                  <button className="btn" onClick={addGames}>Add to shelf</button>
                  <button className="btn ghost" onClick={() => setAdding(false)}>Cancel</button>
                </div>
              </div>
            ) : scanning ? (
              scannerEl
            ) : (
              <>
                <div className="bar">
                  <button className="btn felt" style={{ flex: 1 }} onClick={() => setScanning(true)}>Scan barcode</button>
                  <button className="btn" style={{ flex: 1 }} onClick={() => setAdding(true)}>Add by name</button>
                </div>
                <div className="bar">
                  <input placeholder="Search your games" value={q} onChange={(e) => setQ(e.target.value)} aria-label="Search games" />
                  <select value={sort} onChange={(e) => setSort(e.target.value)} style={{ width: "auto" }} aria-label="Sort">
                    <option value="name">A–Z</option>
                    <option value="idle">Most idle</option>
                  </select>
                </div>
                {locations.length > 0 && (
                  <div className="chips" role="group" aria-label="Filter by location">
                    <button className="chip" aria-pressed={!locFilter} onClick={() => setLocFilter("")}>All</button>
                    {locations.map((l) => (
                      <button key={l} className="chip" aria-pressed={locFilter === l} onClick={() => setLocFilter(locFilter === l ? "" : l)}>{l}</button>
                    ))}
                  </div>
                )}
              </>
            )}

            {unchecked.length > 0 && !adding && !scanning && (
              <button className="btn ghost" style={{ width: "100%", marginBottom: 10 }} disabled={checking} onClick={() => checkTitles(unchecked)}>
                {checking ? "Checking titles…" : `Check ${unchecked.length} title${unchecked.length === 1 ? "" : "s"}`}
              </button>
            )}

            {owned.length === 0 ? (
              <div className="empty">Your shelf is empty. Scan a box, or tap Add by name and paste a list to load your whole collection at once.</div>
            ) : (
              <div className="list">{shelf.map((g) => renderCard(g))}</div>
            )}

            <p className="credit">Title checks from <a href="https://www.wikidata.org" target="_blank" rel="noreferrer">Wikidata</a>. Barcode matches from <a href="https://gameupc.com" target="_blank" rel="noreferrer">GameUPC</a>. New prices from <a href="https://boardgameprices.com" target="_blank" rel="noreferrer">BoardGamePrices.com</a>. Game links go to <a href="https://boardgamegeek.com" target="_blank" rel="noreferrer">BoardGameGeek</a>. Saved on this phone, and synced if Shared shelf is on.<br />Game Shelf version {APP_VERSION}</p>

            <details>
              <summary>Backup and restore</summary>
              <p>Copy this text somewhere safe, like a note. Paste it back here to restore. Box art isn't included, to keep the backup small.</p>
              <textarea readOnly value={JSON.stringify(data)} onFocus={(e) => e.target.select()} />
              <textarea style={{ marginTop: 8 }} placeholder="Paste a backup here" value={importText} onChange={(e) => setImportText(e.target.value)} />
              <button className="btn ghost" style={{ marginTop: 8 }} onClick={() => {
                try {
                  const d = JSON.parse(importText);
                  if (!Array.isArray(d.games)) throw 0;
                  setData({ dustMonths: 12, ...d, games: d.games.map(normalize) });
                  setImportText(""); setToast("Backup restored");
                } catch (e) { setMsg("That backup couldn't be read. Paste the full text exactly as copied."); }
              }}>Restore backup</button>
            </details>

            <details open={!!syncCfg && sync.state === "error"}>
              <summary>Shared shelf{syncCfg ? ` (syncing with ${syncCfg.repo})` : " (sync between phones)"}</summary>
              {syncCfg ? (
                <div style={{ display: "grid", gap: 10 }}>
                  <p style={{ margin: 0 }}>This shelf syncs with everyone connected to <b>{syncCfg.repo}</b>. {sync.at ? `Last synced ${sinceLabel(sync.at)}.` : ""}</p>
                  <div className="bar" style={{ margin: 0, flexWrap: "wrap" }}>
                    <button className="btn ghost" onClick={() => runSync()} disabled={sync.state === "syncing"}>{sync.state === "syncing" ? "Syncing…" : "Sync now"}</button>
                    <button className="btn ghost" onClick={copySetup}>Copy setup code</button>
                  </div>
                  {setupText && <textarea readOnly value={setupText} onFocus={(e) => e.target.select()} style={{ minHeight: 70 }} />}
                  <p style={{ margin: 0 }}>Send the setup code to someone to share this shelf with them. It includes your access token, so only send it to people you trust.</p>
                  <button className="x" style={{ justifySelf: "start", padding: 0 }} onClick={disconnectSync}>Turn off sync on this phone</button>
                </div>
              ) : (
                <div style={{ display: "grid", gap: 10 }}>
                  <label className="f">Got a setup code? Paste it here
                    <input value={codeDraft} onChange={(e) => setCodeDraft(e.target.value)} placeholder="GS1:…" autoComplete="off" />
                  </label>
                  <button className="btn" style={{ justifySelf: "start" }} disabled={!readSetupCode(codeDraft)} onClick={() => connectSync(readSetupCode(codeDraft))}>Connect</button>
                  <p style={{ margin: "8px 0 0" }}>Or set it up with your own private GitHub repo:</p>
                  <label className="f">Data repo
                    <input value={repoDraft} onChange={(e) => setRepoDraft(e.target.value)} placeholder="yourname/game-shelf-data" autoCapitalize="off" autoCorrect="off" />
                  </label>
                  <label className="f">Access token
                    <input type="password" value={tokenDraft} onChange={(e) => setTokenDraft(e.target.value)} placeholder="github_pat_…" autoComplete="off" />
                  </label>
                  <button className="btn" style={{ justifySelf: "start" }} disabled={!repoDraft.includes("/") || !tokenDraft.trim()} onClick={() => connectSync({ repo: repoDraft, token: tokenDraft })}>Connect</button>
                </div>
              )}
              {sync.state === "error" && <p style={{ margin: "10px 0 0", color: "var(--tag)" }}>{sync.error}</p>}
            </details>
          </>
        )}

        {tab === "dust" && (
          <>
            <label className="f" style={{ marginBottom: 12 }}>Not played in
              <select value={data.dustMonths} onChange={(e) => setData((d) => ({ ...d, dustMonths: Number(e.target.value) }))}>
                {[3, 6, 12, 18, 24, 36].map((m) => <option key={m} value={m}>{m} months</option>)}
              </select>
            </label>

            {newbies.length > 0 && (
              <div className="sheet">
                <p style={{ margin: 0 }}>
                  {newbies.length} game{newbies.length === 1 ? " was" : "s were"} added recently with no plays logged, so {newbies.length === 1 ? "it doesn't" : "they don't"} count as unplayed yet. If you've had {newbies.length === 1 ? "it" : "them"} a while, when did you get {newbies.length === 1 ? "it" : "them"}?
                </p>
                <div className="bar" style={{ margin: 0 }}>
                  <select value={fixAge} onChange={(e) => setFixAge(e.target.value)} aria-label="When you got them">
                    {AGE_OPTIONS.filter(([v]) => v !== "0").map(([v, l]) => <option key={v} value={v}>{l}</option>)}
                  </select>
                  <button className="btn" onClick={() => backdate(newbies.map((g) => g.id), Number(fixAge))}>Apply</button>
                </div>
              </div>
            )}

            {dusty.length === 0 ? (
              <div className="empty">Everything's been played in the last {data.dustMonths} months. Try a shorter window to find sale candidates.</div>
            ) : (
              <div className="list">{dusty.map((g) => renderCard(g))}</div>
            )}
            <p className="hint" style={{ marginTop: 12 }}>
              Tap a game to mark it as a keeper, mark it for sale, or log a play if it made it back to the table.
            </p>

          </>
        )}

        {tab === "sale" && (
          <>
            {forSale.length > 0 && (
              <div className="totals">
                <small>{priced.length} of {forSale.length} priced</small>
                <div className="two">
                  <div><small>Garage sale total</small><strong>${sum("garage")}</strong></div>
                  <div><small>Marketplace total</small><strong>${sum("marketplace")}</strong></div>
                </div>
                <div className="bar" style={{ margin: 0, flexWrap: "wrap" }}>
                  <button className="btn" style={{ background: "var(--meeple)", color: "var(--ink)" }} disabled={!priced.length} onClick={copyListing}>Copy Marketplace listing</button>
                  <button className="btn" style={{ background: "transparent", border: "1.5px solid var(--paper)" }} disabled={pricing} onClick={() => priceCheck(forSale, true)}>{pricing ? "Checking…" : "Refresh prices"}</button>
                </div>
              </div>
            )}
            {copyText && <textarea readOnly value={copyText} onFocus={(e) => e.target.select()} style={{ marginBottom: 12 }} />}

            {forSale.length === 0 ? (
              <div className="empty">Nothing marked for sale. Open a game and tap Mark for sale. The Unplayed tab is a good place to find candidates.</div>
            ) : (
              <div className="list">{forSale.map((g) => renderCard(g, true))}</div>
            )}
            {sold.length > 0 && (
              <>
                <h2>Sold: {sold.length} game{sold.length === 1 ? "" : "s"} for ${soldTotal}</h2>
                <ul className="plays">
                  {sold.map((g) => (
                    <li key={g.id}>
                      <span>{g.name}, ${g.soldFor}</span>
                      <button className="x" onClick={() => upd(g.id, (x) => ({ ...x, status: "owned" }))}>Undo</button>
                    </li>
                  ))}
                </ul>
              </>
            )}
          </>
        )}

        {tab === "wish" && (
          <>
            {renderReviews(wishReviews)}
            {scanning ? scannerEl : (
              <>
                <button className="btn felt" style={{ width: "100%", marginBottom: 12 }} onClick={() => setScanning(true)}>Scan a box</button>
                <div className="sheet">
                  <label className="f">Add a game you want
                    <input value={wishName} onChange={(e) => setWishName(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addWish()} placeholder="Game name" />
                  </label>
                  <div className="bar" style={{ margin: 0 }}>
                    <select value={wishPriority} onChange={(e) => setWishPriority(e.target.value)} aria-label="Priority">
                      {PRIORITIES.map((v) => <option key={v}>{v}</option>)}
                    </select>
                    <button className="btn" disabled={!wishName.trim()} onClick={addWish}>Add</button>
                  </div>
                </div>
              </>
            )}
            {wishes.length === 0 ? (
              <div className="empty">Nothing on the wish list yet. Add a game above, or scan a box at the store.</div>
            ) : (
              <div className="list">{wishes.map((g) => renderCard(g, "wish"))}</div>
            )}
            {wishes.length > 0 && (
              <>
                <button className="btn ghost" style={{ marginTop: 12 }} onClick={copyWishes}>Copy wish list</button>
                <p className="hint">Handy to text to family before birthdays and holidays. BGG links are included.</p>
              </>
            )}
            {wishText && <textarea readOnly value={wishText} onFocus={(e) => e.target.select()} />}
          </>
        )}

        {toast && <div className="toast" role="status">{toast}</div>}
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
